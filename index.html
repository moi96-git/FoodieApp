<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoja</title>
<meta name="description" content="Registro sencillo de comidas, calorías y macronutrientes.">
<meta name="theme-color" content="#F2F6EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1711" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hoja">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#F2F6EE; --surface:#FFFFFF; --surface-2:#E8EFE3; --ink:#1D2B20; --ink-2:#4B5B4E; --ink-3:#77877A; --line:#D7E1D2;
  --leaf:#2E8B4E; --leaf-deep:#1E6A38; --leaf-soft:#D6EAD8; --on-leaf:#FFFFFF;
  --p:#B4405F; --c:#B57A00; --f:#2F76B8;
  --ok:#2E9A55; --warn:#D99A00; --bad:#D04A4A;
  --gray:#B3BDB4; --mark:#C2AE88; --live:#8FAE96;
  --shadow:0 1px 2px rgba(30,60,35,.06), 0 6px 18px rgba(30,60,35,.06);
  --r-lg:22px; --r:16px; --r-sm:11px;
  --tab-h:62px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1711; --surface:#16211A; --surface-2:#1E2C22; --ink:#E4EEE1; --ink-2:#B0C1B1; --ink-3:#7F9282; --line:#2A3A2E;
    --leaf:#4CB36B; --leaf-deep:#3A9A57; --leaf-soft:#1F3A27; --on-leaf:#0E1711;
    --p:#D9668A; --c:#B88512; --f:#4A8FD4;
    --ok:#4CB36B; --warn:#E0A825; --bad:#E06464;
    --gray:#56645A; --mark:#8C7A57; --live:#5F8069;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  font-size:16px; line-height:1.4; -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px);
  overscroll-behavior-y:none;
}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid color-mix(in srgb, var(--leaf) 55%, transparent);outline-offset:2px;border-radius:8px}
.num,.tab-num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px 0}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;margin:12px 0}
@media (prefers-color-scheme: dark){.card{border:1px solid var(--line)}}

/* top bar */
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 2px}
.datebar .dtitle{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:50px}
.datebar .dtitle b{font-size:22px;letter-spacing:-.02em}
.datebar .dtitle span{font-size:13px;color:var(--ink-3)}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:active{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px}
.iconbtn[disabled]{opacity:.3;pointer-events:none}

/* hero */
.hero{display:grid;grid-template-columns:118px 1fr;gap:18px;align-items:center;padding:18px 18px 18px 14px}
.leaf{width:118px;height:auto;display:block;overflow:visible}
.leaf .leaf-bg{fill:var(--leaf-soft)}
.leaf .leaf-edge{fill:none;stroke:var(--leaf-deep);stroke-width:2;opacity:.35}
.leaf .leaf-veins{fill:none;stroke:var(--surface);stroke-width:1.6;stroke-linecap:round;opacity:.7}
.leaf .leaf-stem{stroke:var(--leaf-deep);stroke-width:3.2;stroke-linecap:round;fill:none}
.leaf .leaf-fill{transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.leaf.intro .leaf-fill{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(160px)}}
@media (prefers-reduced-motion: reduce){.leaf.intro .leaf-fill,.leaf .leaf-fill{animation:none;transition:none}}
.kcal-big{display:flex;align-items:baseline;gap:6px}
.kcal-big .num{font-size:46px;font-weight:800;letter-spacing:-.035em;line-height:1}
.kcal-big .unit{font-size:16px;color:var(--ink-3);font-weight:600}
.kcal-of{color:var(--ink-2);margin-top:4px}
.kcal-left{margin-top:10px;font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ex-note{display:block;font-size:13px;color:var(--ink-3)}

/* status */
.st{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:800;color:#fff;flex:none;line-height:1}
.st-ok{background:var(--ok)} .st-warn{background:var(--warn)} .st-bad{background:var(--bad)} .st-none{background:var(--line);color:var(--ink-3)}
@media (prefers-color-scheme: dark){.st{color:#0E1711}}
.stlabel{font-size:13px;font-weight:600;color:var(--ink-2)}

/* macros */
.mrow+.mrow{margin-top:14px}
.mhead{display:flex;align-items:center;gap:8px}
.mname{font-weight:650;display:flex;align-items:center;gap:8px;flex:1}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.sw-p{background:var(--p)} .sw-c{background:var(--c)} .sw-f{background:var(--f)}
.mval{color:var(--ink-2);font-variant-numeric:tabular-nums}
.mval b{color:var(--ink)}
.bar{position:relative;height:10px;border-radius:6px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .5s ease}
.bar-target{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-2);opacity:.6}
.mfoot{font-size:13px;color:var(--ink-3);margin-top:5px}

/* duo cards */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.duo .card{margin:0;padding:14px}
.minihead{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--ink-2);font-weight:650;font-size:14px}
.minival{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.minival small{font-size:13px;color:var(--ink-3);font-weight:600;letter-spacing:0}
.water-glasses{display:flex;gap:3px;margin:8px 0 10px;flex-wrap:wrap}
.water-glasses i{width:12px;height:16px;border-radius:2px 2px 4px 4px;background:var(--surface-2);display:block}
.water-glasses i.on{background:#3B8FD0}
.pillrow{display:flex;gap:6px;flex-wrap:wrap}
.pill{border-radius:999px;padding:7px 11px;background:var(--surface-2);font-weight:650;font-size:14px;color:var(--ink)}
.pill:active{filter:brightness(.95)}
.pill[disabled]{opacity:.45;pointer-events:none}
.pill.leafy{background:var(--leaf-soft);color:var(--leaf-deep)}
@media (prefers-color-scheme: dark){.pill.leafy{color:var(--leaf)}}

/* meals */
.meal header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.meal h3{font-size:18px;flex:1}
.meal .mk{color:var(--ink-2);font-weight:650;font-variant-numeric:tabular-nums}
.entries{list-style:none;margin:0;padding:0}
.entries{touch-action:pan-y}
.entry{position:relative;overflow:hidden;border-top:1px solid var(--line);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.entry-in{position:relative;display:flex;align-items:center;gap:10px;padding:10px 0;background:var(--surface);cursor:pointer}
.entry-del{position:absolute;inset:0;display:flex;justify-content:flex-end;background:var(--bad);visibility:hidden;transition:visibility 0s .2s}
.entry.swiping .entry-del,.entry.open .entry-del{visibility:visible;transition:none}
.entry-del button{width:88px;color:#fff;font-weight:700;font-size:14px}
.entry:first-child{border-top:0}
.entry .en{flex:1;min-width:0}
.entry .nm{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .am{display:block;font-size:13px;color:var(--ink-3)}
.entry .ek{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.entry .ek small.mm{display:flex;justify-content:flex-end;margin-top:2px}
.entry .ek small{display:block;font-weight:500;font-size:12px;color:var(--ink-3)}
.mm{display:inline-flex;gap:8px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mm span{display:inline-flex;align-items:center;gap:3px}
.mm .sw{width:7px;height:7px;border-radius:2px}
.addbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:8px;padding:12px;border-radius:var(--r);background:var(--leaf-soft);color:var(--leaf-deep);font-weight:700}
@media (prefers-color-scheme: dark){.addbtn{color:var(--leaf)}}
.addbtn:active{filter:brightness(.96)}
.addbtn svg{width:18px;height:18px}
.ex-list{margin:6px 0 0;padding:0;list-style:none}
.ex-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ex-list li:first-child{border-top:0}
.ex-list li span{flex:1}

.mealsum{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:0 0 4px}
.mealsum .mm{font-size:13px}
.homechk{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:650;color:var(--ink-2);padding:6px 0;cursor:pointer}
.homechk input{width:20px;height:20px;margin:0;accent-color:var(--leaf)}
.fastnote{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:650}
.insight{font-size:16px;line-height:1.45;margin:0}
.insight b{font-variant-numeric:tabular-nums}
.splitbar .home{background:var(--leaf)} .splitbar .out{background:var(--line)}

/* v1.3 */
.pill.sm{padding:5px 11px;font-size:13px}
.waterbar{padding:12px 14px}
.waterbar .wrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.waterbar .wlabel{font-weight:650;color:var(--ink-2)}
.waterbar .wval{flex:1 1 auto;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:14px}
.waterbar .wbtns{display:flex;gap:6px;margin-left:auto}
.waterbar .wbtns .pill{padding:5px 9px}
.waterbar .wval b{color:var(--ink);font-size:16px}
.waterbar .bar{height:6px;margin-top:8px}
.dtitle b svg{width:15px;height:15px;vertical-align:-1px;margin-left:6px;color:var(--ink-3)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;font-weight:800;color:transparent;line-height:1}
.check.on{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf)}
.multibar{position:sticky;bottom:0;padding:14px 0 2px;background:linear-gradient(transparent,var(--bg) 35%)}
.proc{display:inline-block;font-size:11px;font-weight:800;padding:2px 6px;border-radius:6px;margin-left:4px;vertical-align:1px;color:#fff}
.ns-a{background:#2E9A55}.ns-b{background:#7DB84A}.ns-c{background:#D9A400}.ns-d{background:#E07B20}.ns-e{background:#D04A4A}
.nova-1,.nova-2{background:#2E9A55}.nova-3{background:#D9A400}.nova-4{background:#D04A4A}
.bullets{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--ink-2)}
.bullets li{margin:5px 0}
.progress{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.progress span{display:block;height:100%;background:var(--leaf);border-radius:5px}
.planned{color:var(--leaf-deep);font-weight:650}
@media (prefers-color-scheme: dark){.planned{color:var(--leaf)}}

/* v1.4 · cierre del día */
.st-open{background:var(--gray);color:var(--surface)} .st-mark{background:var(--mark);color:#fff}
.closecard{background:var(--surface-2);box-shadow:none}
.closecard .insight{display:flex;gap:8px;align-items:flex-start}
.choice{display:block;width:100%;text-align:left;padding:14px 16px;margin:8px 0;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:16px;color:var(--ink)}
.choice:active{filter:brightness(.96)}
.choice small{display:block;font-weight:500;font-size:13px;color:var(--ink-3);margin-top:3px}
.linkbtn{color:var(--leaf-deep);font-weight:700;text-decoration:underline;font-size:inherit}
@media (prefers-color-scheme: dark){.linkbtn{color:var(--leaf)}}
.closed-line{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.donemsg{text-align:center;padding:20px 0 6px}
.donemsg b{display:block;font-size:20px;margin-bottom:4px}

/* v1.5 · estimar, aviso discreto, hora de comida, semáforo */
.st-live{background:transparent;box-shadow:inset 0 0 0 2px var(--live)}
.dotbtn{display:inline-grid;place-items:center;border-radius:50%}
.choice.rec{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf)}
.choice.rec small{color:var(--on-leaf);opacity:.85}
.choice.quiet{background:transparent;border-color:transparent;color:var(--ink-2);font-weight:650;padding-top:8px;padding-bottom:8px}
.rectag{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:800;background:color-mix(in srgb, var(--on-leaf) 20%, transparent);vertical-align:1px}
.estsec{margin:14px 0}
.estsec h3{font-size:15px;margin:0 0 6px}
.estlevels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.estlevel{padding:10px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px;text-align:center}
.estlevel small{display:block;font-weight:600;font-size:13px;color:var(--ink-3);margin-top:2px}
.estlevel.on{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf)}
.estlevel.on small{color:var(--on-leaf)}
.chip small{display:block;font-size:12px;font-weight:600;opacity:.75}
.chip[disabled]{opacity:.4;pointer-events:none}
.estdrinks{display:flex;align-items:center;gap:10px}
.estdrinks b{flex:1;text-align:center;font-size:17px}
.esttotal{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;align-items:center;justify-content:center;gap:12px;border-top:1px solid var(--line);margin-top:10px}
.esttotal .num{font-size:30px;font-weight:800;letter-spacing:-.02em;min-width:150px;text-align:center}
.nag{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:var(--r-sm);padding:4px 4px 4px 12px;margin:8px 0;font-size:14px;font-weight:600;touch-action:pan-y}
.nag span{flex:1;min-width:0}
.nag .iconbtn{width:36px;height:36px}
.nag .iconbtn svg{width:16px;height:16px}
.timechip{font-size:13px;font-weight:650;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:3px 7px;font-variant-numeric:tabular-nums;white-space:nowrap}
.timectl .timerow{display:flex;gap:8px;align-items:center}
.timectl .timerow .input{flex:1;min-width:0;text-align:center}
.timectl .pillrow{justify-content:center;margin-top:10px}
.timectl .step{font-size:15px}

/* banner */
.banner{display:flex;gap:12px;align-items:center;background:var(--leaf-soft);border-radius:var(--r);padding:12px 14px;margin:10px 0}
.banner{flex-wrap:wrap}
.banner p{margin:0;flex:1 1 100%;font-size:14px}
.banner .btn{flex:1}
.banner .btn{padding:9px 12px}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:var(--r);font-weight:700;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--leaf);color:var(--on-leaf)}
.btn.danger{background:transparent;color:var(--bad)}
.btn.block{width:100%}
.btn:active{filter:brightness(.95)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btnrow .btn{flex:1}
.field{display:block;margin:12px 0}
.field>span{display:block;font-size:14px;color:var(--ink-2);font-weight:600;margin-bottom:6px}
.input,select.input{width:100%;padding:12px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);font-size:16px;appearance:none;-webkit-appearance:none}
.input:focus{border-color:var(--leaf);outline:none}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid4 .field{margin:6px 0}
.grid4 .input{padding:11px 8px;text-align:center}
.hint{font-size:13px;color:var(--ink-3);margin:6px 0 0}
.warnline{font-size:13px;color:var(--bad);margin:6px 0 0}

/* segmented */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;margin:10px 0}
.seg{overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:9px 10px;border-radius:9px;font-weight:650;font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-color-scheme: dark){.seg button.on{background:var(--line)}}

/* tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:650;color:var(--ink-3)}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--leaf-deep)}
@media (prefers-color-scheme: dark){.tabbar button.on{color:var(--leaf)}}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50;pointer-events:none}
.sheet-backdrop{position:absolute;inset:0;background:rgba(10,20,12,.38);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:calc(100% - env(safe-area-inset-top) - 24px);display:flex;flex-direction:column;background:var(--bg);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet-wrap.open{pointer-events:auto}
.sheet-wrap.open .sheet-backdrop{opacity:1}
.sheet-wrap.open .sheet{transform:none}
@media (prefers-reduced-motion: reduce){.sheet,.sheet-backdrop{transition:none}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px 12px 6px 18px}
.sheet-head h2{flex:1;font-size:20px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 22px;flex:1}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}

/* search */
.searchbox{position:relative;margin:6px 0 10px}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-3)}
.searchbox .input{padding-left:38px;border-radius:14px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;border-radius:14px;background:var(--surface);font-size:13px;font-weight:650;color:var(--ink-2);border:1px solid var(--line)}
.tool svg{width:22px;height:22px;color:var(--leaf)}
.listtitle{font-size:13px;font-weight:700;color:var(--ink-3);margin:16px 0 4px}
.rlist{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
.ritem{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line)}
.ritem:first-child{border-top:0}
.ritem .rmain{flex:1;min-width:0;cursor:pointer}
.ritem .rname{display:block;font-weight:600;line-height:1.25}
.ritem .rsub{display:block;font-size:13px;color:var(--ink-3);margin-top:2px}

const dayName = k => { const t = today(); if (k === t) return 'Hoy'; if (k === addDays(t,-1)) return 'Ayer'; if (k === addDays(t,1)) return 'Mañana'; const d = dateOf(k); return DIAS_L[d.getDay()][0].toUpperCase() + DIAS_L[d.getDay()].slice(1); };

  const t = today(), d = dateOf(k);
  if (Math.abs(daysBetween(k, t)) <= 1 || mondayOf(k) === mondayOf(t)) return {big: dayName(k), small: shortDate(k)};
  return {big: `${d.getDate()} ${MESES[d.getMonth()]}${k.slice(0, 4) !== t.slice(0, 4) ? ' ' + k.slice(0, 4) : ''}`, small: ''};
}
const pad2 = n => String(n).padStart(2, '0');
const nowTime = () => { const d = new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const defTime = k => k === today() ? nowTime() : '';
const validTime = t => /^([01]\d|2[0-3]):[0-5]\d$/.test(t || '') ? t : '';
const toMin = t => +t.slice(0, 2) * 60 + +t.slice(3);

const daysBetween = (a, b) => Math.round((dateOf(b) - dateOf(a)) / 864e5);

/* ---------- estado ---------- */
const KEY = 'hoja.v1';
// Cierre del día (v4). Causas: [id, texto de la ficha, texto corto para la etiqueta "Cerrado: …"]
const CAUSES = [['over', 'Comí de más', 'comí de más'], ['alcohol', 'Tomé alcohol', 'alcohol'], ['event', 'Celebración o evento', 'celebración'],

function defaultState() {
  return {
    v: 4,
    settings: {
      meals: [{id:'m1', name:'Desayuno'}, {id:'m2', name:'Almuerzo'}, {id:'m3', name:'Comida'}],
      goals: {kcal: 2000, p: 150, c: 200, f: 67},
      macroMode: 'g', exCarb: 60, water: 2000,
      profile: {sex: '', height: null, age: null, weight: null, activity: 1.2},
      backupDays: 7, lastBackup: 0, created: Date.now(), bannerHidden: '',

function migrate(s) {

  for (const k of Object.keys(s.days)) {
    const d = s.days[k];
    if (!d || typeof d !== 'object') { delete s.days[k]; continue; }
    if (!Array.isArray(d.entries)) d.entries = [];
    if (!Array.isArray(d.ex)) d.ex = [];

    if (d.weight === undefined) d.weight = null;
    if (d.fasting !== true) delete d.fasting;
    if (!d.home || typeof d.home !== 'object' || Array.isArray(d.home)) delete d.home;

  // y los días anteriores con alimentos o ayuno quedan cerrados como completos (legacy).
  const st = s.settings;

  try { localStorage.setItem(KEY, JSON.stringify(S)); saveFailed = false; }

}

/* ---------- alimentos ---------- */
/* Líquidos de la base: se muestran en ml (1 g = 1 ml, sin densidades). Los datos siguen guardados por 100. */

const BASE_URL = 'data/alimentos.csv', BASE_CACHE = 'hoja-datos'; // BASE_CACHE: sw.js no debe borrarla ni interceptar BASE_URL

const BASE_SRC = {es: ', típicos de etiqueta en España', est: ', estimados a partir de una receta típica', cadena: ', según la información publicada por la cadena (aproximados)', base: ', de tablas de referencia (USDA)'};
let BASE = [], BASE_MAP = new Map(), CATS = [];

function csvRows(text) { // CSV estándar, con comillas. Acepta ; o , (Excel y Google Sheets exportan distinto)
  const sep = text.split('\n')[0].includes(';') ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;

  let multi = false; const sel = new Map(); // alimentos marcados en el modo "varios"
  const updBar = () => {
    const bar = $('.multibar', body), mb = $('[data-s="multi"]', body); if (!bar) return;
    bar.hidden = !multi || !sel.size;
    $('button', bar).textContent = `Añadir ${sel.size} ${sel.size === 1 ? 'alimento' : 'alimentos'}`;
    mb.textContent = multi ? 'Cancelar selección' : 'Seleccionar varios'; mb.setAttribute('aria-pressed', multi);
  };
  const draw = () => {
    const q = inp.value.trim(); lastQ = q;
    let html = '';
    const quick = !!o.onQuick && !multi, sl = multi ? sel : null;
    if (!q) {
      if (o.onRecipe && S.recipes.length) html += `<div class="listtitle">Mis comidas</div><ul class="rlist">${S.recipes.map(r => { const t = recipeTotals(r); return `<li class="ritem"><div class="rmain" data-s="recipe" data-id="${r.id}" role="button" tabindex="0"><span class="rname">${esc(r.name)}</span><span class="rsub">${r.items.length} alimentos, ${fInt(t.k)} kcal</span></div><button class="quick" data-s="recipe" data-id="${r.id}" aria-label="Añadir ${esc(r.name)}">${ICON.plus}</button></li>`; }).join('')}</ul>`;
      let fr = frequent(o.meal);
      const title = fr.length ? 'Los que más usas' : 'Para empezar';
      if (!fr.length) fr = STARTERS.map(getFood).filter(Boolean);
      html += `<div class="listtitle">${title}</div><ul class="rlist">${fr.map(f => foodRow(f, quick, sl)).join('')}</ul>`;
    } else {
      const list = search(q);
      html += list.length ? `<ul class="rlist">${list.map(f => foodRow(f, quick, sl)).join('')}</ul>` : `<div class="empty"><b>Sin resultados en tu base</b>Prueba otra palabra, busca en Open Food Facts o crea el alimento.</div>`;
      html += `<div class="btnrow"><button class="btn block" data-s="off">Buscar «${esc(q.length > 22 ? q.slice(0, 21) + '…' : q)}» en Open Food Facts</button></div><div class="offres"></div>`;
    }
    res.innerHTML = html;
    updBar();
  };
  rec.refresh = draw;
  let tmr; inp.addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(draw, 90); });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
  body.addEventListener('click', async ev => {
    const a = ev.target.closest('[data-s]'); if (!a) return;
    const s = a.dataset.s;
    const resolve = fid => getFood(fid) || offItems.get(fid);
    if (s === 'multi') { multi = !multi; sel.clear(); draw(); }
    else if (s === 'multiok') {
      const list = Array.from(sel.values()), added = [];
      for (const f of list) { const u = S.usage[f.fid]; added.push(addEntry(CUR, o.meal, f, u && u.q ? u.q : 100, u && u.unit ? u.unit : null)); }
      const ids = added.map(e => e.id), m = o.meal, k = CUR;
      closeAll(); render();
      addedToast(`Añadidos ${list.length} alimentos a ${mealName(m)}`, added, () => { ids.forEach(id => removeEntry(k, id)); render(); });
    }
    else if (s === 'pick' && multi) {
      const f = resolve(a.dataset.fid); if (!f) return;
      if (sel.has(f.fid)) sel.delete(f.fid); else sel.set(f.fid, f);
      const c = a.closest('.ritem').querySelector('.check'); if (c) c.classList.toggle('on', sel.has(f.fid));
      updBar();
    }
    else if (s === 'pick') { const f = resolve(a.dataset.fid); f && o.onPick(f); }
    else if (s === 'quick') { const f = resolve(a.dataset.fid); f && o.onQuick(f); }
    else if (s === 'recipe') { const r = S.recipes.find(r => r.id === a.dataset.id); r && o.onRecipe(r); }
    else if (s === 'scan') openScanner(o.meal);
    else if (s === 'quickmacros') openQuickMacros({meal: o.meal});
    else if (s === 'newfood') openFoodEditor(null, {name: inp.value.trim(), after: f => o.onPick(f)});
    else if (s === 'off') {
      const box = $('.offres', body), q = inp.value.trim();
      a.disabled = true; a.textContent = 'Buscando…';
      try {
        const items = await offSearch(q);
        if (q !== lastQ) return;
        items.forEach(f => offItems.set(f.fid, f));
        box.innerHTML = items.length ? `<div class="listtitle">Open Food Facts</div><ul class="rlist">${items.map(f => foodRow(f, false, multi ? sel : null)).join('')}</ul>` : `<div class="empty"><b>Sin resultados en Open Food Facts</b>Revisa la ortografía o crea el alimento con los datos de la etiqueta.</div>`;
        a.remove();
      } catch (e) {
        a.disabled = false; a.textContent = 'Reintentar búsqueda en Open Food Facts';
        box.innerHTML = `<div class="empty"><b>No se pudo conectar con Open Food Facts</b>Comprueba tu conexión a internet e inténtalo de nuevo.</div>`;
      }
    }
  });
  draw();
  if (!matchMedia('(pointer: coarse)').matches) setTimeout(() => inp.focus(), 280);
}

/* ---------- cantidad ---------- */
function openQty(food, o) {
  // o: {meal, entry (edit), date, onDone, title}
  const editing = !!o.entry;
  const units = food.u || [];
  let grams = editing ? o.entry.q : (S.usage[food.fid] && S.usage[food.fid].q) || 100;
  let mode = 'x';
  let unitIdx = -1;
  const prevUnit = editing ? o.entry.u : (S.usage[food.fid] && S.usage[food.fid].unit);
  if (prevUnit) { const i = units.findIndex(u => u[0] === prevUnit.l); if (i >= 0) { mode = 'u'; unitIdx = i; } }
  let meal = o.meal || (o.entry && o.entry.m) || S.settings.meals[0].id;
  let time = editing ? (o.entry.t || '') : defTime(o.date || CUR);
  let timeSet = editing; // si no se toca, al añadir vale la hora del toque, no la de abrir la hoja
  const qu = qUnit(food), qWord = qu === 'ml' ? 'Mililitros' : 'Gramos';
  openSheet(editing ? 'Editar' : food.n, (body, rec) => {
    const draw = () => {
      const unit = mode === 'u' ? units[unitIdx] : null;
      const val = mode === 'x' ? grams / 100 : mode === 'g' ? grams : grams / unit[1];
      const r = {k: food.k * grams / 100, p: food.p * grams / 100, c: food.h * grams / 100, f: food.g * grams / 100};
      const chips = mode === 'x' ? [[.25,'¼'],[.5,'½'],[.75,'¾'],[1,'1'],[1.5,'1½'],[2,'2'],[3,'3']] : mode === 'g' ? [[30,'30'],[50,'50'],[100,'100'],[150,'150'],[200,'200'],[250,'250']] : [[.5,'½'],[1,'1'],[2,'2'],[3,'3'],[4,'4']];
      const lbl = mode === 'x' ? `× 100 ${qu}` : mode === 'g' ? qWord.toLowerCase() : unit[0].replace(/^1\s+/, '');
      body.innerHTML = `
        ${editing ? `<div style="font-weight:700;font-size:18px">${esc(food.n)}</div>` : ''}
        <div class="per100">Por 100 ${qu}: ${fInt(food.k)} kcal, P ${fG(food.p)} g, C ${fG(food.h)} g, G ${fG(food.g)} g ${procTags(food)}</div>
        <div class="seg" role="tablist">
          <button data-s="mode" data-m="x" class="${mode === 'x' ? 'on' : ''}">× 100 ${qu}</button>
          <button data-s="mode" data-m="g" class="${mode === 'g' ? 'on' : ''}">${qWord}</button>
          ${units.map((u, i) => `<button data-s="mode" data-m="u" data-i="${i}" class="${mode === 'u' && unitIdx === i ? 'on' : ''}">${esc(u[0].replace(/^1\s+/, ''))}</button>`).join('')}
        </div>
        <div class="qtyline">
          <button class="step" data-s="dec" aria-label="Menos">−</button>
          <input class="input" inputmode="decimal" value="${NF1.format(r1(val)).replace(/\./g,'')}" aria-label="Cantidad en ${lbl}">
          <span class="unitlbl">${esc(lbl)}</span>
          <button class="step" data-s="inc" aria-label="Más">+</button>
        </div>
        <div class="chips">${chips.map(c => `<button class="chip ${Math.abs(val - c[0]) < 1e-6 ? 'on' : ''}" data-s="chip" data-v="${c[0]}">${c[1]}</button>`).join('')}</div>
        ${mode !== 'g' ? `<p class="hint" style="margin:-4px 0 10px">${fG(grams)} ${qu} en total</p>` : ''}
        <div class="preview" aria-live="polite">
          <div><b>${fInt(r.k)}</b><span>kcal</span></div>
          <div><b>${fG(r.p)}</b><span><i class="sw sw-p"></i>Prot.</span></div>
          <div><b>${fG(r.c)}</b><span><i class="sw sw-c"></i>Carb.</span></div>
          <div><b>${fG(r.f)}</b><span><i class="sw sw-f"></i>Grasa</span></div>
        </div>
        ${o.pickOnly ? '' : `<label class="field"><span>Comida</span><select class="input" data-s="meal">${S.settings.meals.map(m => `<option value="${m.id}" ${m.id === meal ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select></label>
        <div class="field"><span>Hora (opcional)</span><div data-time></div></div>`}
        <div class="btnrow">${editing ? `<button class="btn danger" data-s="del">Eliminar</button>` : ''}<button class="btn primary" data-s="ok" ${grams > 0 ? '' : 'disabled'}>${editing ? 'Guardar' : o.okLabel || 'Añadir'}</button></div>`;
      const inp = $('.qtyline input', body);
      inp.addEventListener('input', () => {
        const v = parseNum(inp.value);
        if (isFinite(v) && v >= 0) { grams = mode === 'x' ? v * 100 : mode === 'g' ? v : v * units[unitIdx][1]; refreshPreview(); }
      });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { inp.blur(); } });
      const tb = $('[data-time]', body); if (tb) timeControl(tb, timeSet ? time : defTime(o.date || CUR), t => { time = t; timeSet = true; });
    };
    const refreshPreview = () => {
      const b = $$('.preview b', body); if (!b.length) return;
      b[0].textContent = fInt(food.k * grams / 100); b[1].textContent = fG(food.p * grams / 100); b[2].textContent = fG(food.h * grams / 100); b[3].textContent = fG(food.g * grams / 100);
      const h = $('.hint', body); if (h && mode !== 'g') h.textContent = `${fG(grams)} ${qu} en total`;
      const ok = $('[data-s="ok"]', body); if (ok) ok.disabled = !(grams > 0);
      const unitG = mode === 'x' ? 100 : mode === 'g' ? 1 : units[unitIdx][1];
      $$('.chip', body).forEach(c => c.classList.toggle('on', Math.abs(grams / unitG - +c.dataset.v) < 1e-6));
    };
    body.addEventListener('click', ev => {
      const a = ev.target.closest('[data-s]'); if (!a) return;
      const s = a.dataset.s;
      const unitG = mode === 'x' ? 100 : mode === 'g' ? 1 : units[unitIdx][1];
      const stepV = mode === 'x' ? .25 : mode === 'g' ? 10 : .5;
      if (s === 'mode') { mode = a.dataset.m; unitIdx = mode === 'u' ? +a.dataset.i : -1; if (mode === 'u') { const ug = units[unitIdx][1]; grams = ug * Math.max(1, Math.round(grams / ug)); } draw(); }
      else if (s === 'chip') { grams = +a.dataset.v * unitG; draw(); }
      else if (s === 'inc') { const v = grams / unitG; grams = (Math.floor(v / stepV + 1e-6) + 1) * stepV * unitG; draw(); }
      else if (s === 'dec') { const v = grams / unitG; grams = Math.max(0, (Math.ceil(v / stepV - 1e-6) - 1) * stepV * unitG); draw(); }
      else if (s === 'del') { closeAll(); deleteEntry(o.date || CUR, o.entry.id); }
      else if (s === 'ok') {
        time = timeSet ? validTime(time) : defTime(o.date || CUR);
        const unit = mode === 'u' ? {l: units[unitIdx][0], n: r1(grams / units[unitIdx][1]), g: units[unitIdx][1]} : null;
        if (o.onDone) { o.onDone(food, grams, unit); return; }
        if (editing) {
          const e = o.entry; e.q = r1(grams); e.m = meal; if (unit) e.u = unit; else delete e.u; if (time) e.t = time; else delete e.t;
          if (e.fid && S.usage[e.fid]) { S.usage[e.fid].q = e.q; S.usage[e.fid].unit = unit; }
          save(); closeAll(); render(); toast('Guardado');
        } else {
          const k = CUR, e = addEntry(k, meal, food, grams, unit, false, time); closeAll(); render();
          addedToast(`Añadido a ${mealName(meal)}`, [e], () => { removeEntry(k, e.id); render(); });
        }
      }
    });
    body.addEventListener('change', ev => { if (ev.target.dataset.s === 'meal') meal = ev.target.value; });
    draw();
  }, {back: !editing && !o.noBack, closeAll: !o.onDone});
}

    const calc = () => { const est = val('p') * 4 + val('c') * 4 + val('f') * 9; $('[data-calc]', body).textContent = est ? `Según los macros: ${fInt(est)} kcal` : ''; return est; };

      const kd = CUR, dd = day(kd, true); delete dd.fasting; const ne = {id: uid('e'), m, fid: null, x: 'q', n, k: r1(k), p: r1(val('p')), h: r1(val('c')), g: r1(val('f')), q: 100}; if (tm) ne.t = tm; dd.entries.push(ne);

        <label class="field"><span>Nutri-Score (opcional)</span><select class="input" data-k="ns"><option value="">Sin indicar</option>${['a', 'b', 'c', 'd', 'e'].map(l => `<option value="${l}" ${src.ns === l ? 'selected' : ''}>${l.toUpperCase()}</option>`).join('')}</select></label>
      </div>

        ${units.map((u, i) => `<div class="grid2" style="margin-bottom:8px"><input class="input" data-u="l${i}" value="${esc(u[0])}" placeholder="1 unidad"><input class="input" data-u="g${i}" inputmode="decimal" value="${u[1] !== '' ? u[1] : ''}" data-l="ph"></div>`).join('')}
      </div>
      <label class="field"><span>Código de barras (opcional)</span><input class="input" data-k="code" inputmode="numeric" value="${esc(src.code || '')}"></label>
      <div class="btnrow">${ex ? '<button class="btn danger" data-s="del">Eliminar</button>' : ''}<button class="btn primary" data-s="ok">Guardar</button></div>`;
    const v = k => parseNum($(`[data-k="${k}"]`, body).value);
    const refG = () => { const r = v('ref'); return r > 0 ? r : NaN; };
    const isL = () => $('[data-k="liq"]', body).checked, qWord = () => isL() ? 'mililitros' : 'gramos';
    const calc = () => {
      const qu = isL() ? 'ml' : 'g', w = qWord();
      $('[data-l="intro"]', body).textContent = `Escribe los valores como aparecen en la etiqueta e indica a cuántos ${w} corresponden. Hoja los guarda por 100 ${qu}.`;
      $('[data-l="ref"]', body).textContent = `Los valores de abajo son para (${w})`;
      $('[data-l="units"]', body).textContent = `Unidades (opcional): cuántos ${w} ${isL() ? 'tiene' : 'pesa'} cada una`;
      $$('[data-l="ph"]', body).forEach(x => { x.placeholder = w; });
      const est = (v('p') || 0) * 4 + (v('h') || 0) * 4 + (v('g') || 0) * 9, r = refG();
      let txt = est ? `Según los macros: ${fInt(est)} kcal` : '';
      if (est && isFinite(r) && Math.abs(r - 100) > 1e-9) { const f = 100 / r; txt += `. Por 100 ${qu}: ${fInt((isFinite(v('k')) ? v('k') : est) * f)} kcal, P ${fG((v('p') || 0) * f)} C ${fG((v('h') || 0) * f)} G ${fG((v('g') || 0) * f)}`; }
      else if (est) txt += ` por 100 ${qu}`;
      $('[data-calc]', body).textContent = txt; return est;
    };
    body.addEventListener('input', calc); calc();
    body.addEventListener('click', ev => {
      const a = ev.target.closest('[data-s]'); if (!a) return;
      if (a.dataset.s === 'del') {
        if (!confirm('¿Eliminar este alimento de tu base? Los registros pasados se conservan.')) return;

      }
      const n = $('[data-k="n"]', body).value.trim();
      if (!n) { toast('Escribe un nombre'); return; }
      const ref = refG();
      if (!isFinite(ref)) { toast(`Indica a cuántos ${qWord()} corresponden los valores`); return; }
      const f = 100 / ref; // todo se guarda por 100 g
      const est = calc(), kk = v('k');
      const k = (isFinite(kk) ? kk : est) * f;
      if (!(k >= 0) || (!k && !est)) { toast('Escribe las calorías o los macros'); return; }
      const u = [];
      for (let i = 0; i < units.length; i++) { const l = $(`[data-u="l${i}"]`, body).value.trim(), g = parseNum($(`[data-u="g${i}"]`, body).value); if (l && g > 0) u.push([l, g]); }

      const rec = {n, c: $('[data-k="c"]', body).value, k: Math.round(k), p: r1((v('p') || 0) * f), h: r1((v('h') || 0) * f), g: r1((v('g') || 0) * f), u, nova: +$('[data-k="nova"]', body).value || 0, ns: $('[data-k="ns"]', body).value, src: ex ? ex.src || 'user' : 'user', code: $('[data-k="code"]', body).value.trim()};
      if (isL()) rec.liq = 1;
      const id = fid || uid('f');
      S.foods[id] = rec; dirtyIndex(); save();

/* ---------- Open Food Facts ---------- */
const OFF = 'https://world.openfoodfacts.org';
const OFF_FIELDS = 'code,product_name,product_name_es,generic_name_es,brands,nutriments,serving_quantity,nutriscore_grade,nova_group,quantity,product_quantity_unit,categories_tags';
async function fetchJSON(url, ms = 12000) {
  const ac = new AbortController(); const t = setTimeout(() => ac.abort(), ms);
  try { const r = await fetch(url, {signal: ac.signal}); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
function offLiquid(p) { // ml o l en la cantidad, o categoría de bebidas. Una bebida en g o kg es seca: café molido, cacao, polvos
  const m = /(\d|\s|^)(ml|cl|dl|l|lt|litros?|g|gr|kg)\b/i.exec(String(p.quantity || '')), u = String(p.product_quantity_unit || (m ? m[2] : '')).trim().toLowerCase();
  if (/^(ml|cl|dl|l|lt|litros?)$/.test(u)) return 1;
  const tags = Array.isArray(p.categories_tags) ? p.categories_tags : [];
  return !/^(g|gr|kg)$/.test(u) && !tags.some(c => /powder|dehydrated|instant/.test(c)) && tags.some(c => /beverages$/.test(c)) ? 1 : 0;
}
function offToFood(p) {
  if (!p) return null;
  const n = p.nutriments || {};
  let k = n['energy-kcal_100g'];
  if (k == null && n['energy_100g'] != null) k = n['energy_100g'] / 4.184;
  if (k == null && n.proteins_100g == null && n.carbohydrates_100g == null) return null;
  const name = (p.product_name_es || p.product_name || p.generic_name_es || '').trim();
  if (!name) return null;
  const brand = (p.brands || '').split(',')[0].trim();
  const f = {fid: 'off' + p.code, n: brand && !norm(name).includes(norm(brand)) ? `${name} (${brand})` : name, c: 'Productos', k: Math.round(+k || 0), p: r1(n.proteins_100g), h: r1(n.carbohydrates_100g), g: r1(n.fat_100g), u: [], src: 'off', code: String(p.code || ''), ns: '', nova: 0, liq: offLiquid(p)};
  const sq = parseFloat(p.serving_quantity); if (sq > 0) f.u = [['1 ración', r1(sq)]];
  const ns = String(p.nutriscore_grade || '').toLowerCase(); if (NS_OK.test(ns)) f.ns = ns;
  const nv = Math.round(+p.nova_group); if (nv >= 1 && nv <= 4) f.nova = nv;
  return f;
}
async function offProduct(code) {
  const j = await fetchJSON(`${OFF}/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`);
  return j && j.status === 1 ? offToFood(j.product) : null;
}
async function offSearch(q) {
  let list;
  try {
    const j = await fetchJSON(`${OFF}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=25&lc=es&fields=${OFF_FIELDS}`, 15000);
    list = j.products || [];
  } catch (e) {
    // Alternativa: el nuevo buscador de Open Food Facts (Search-a-licious)
    const j = await fetchJSON(`https://search.openfoodfacts.org/search?q=${encodeURIComponent(q)}&page_size=25&langs=es&fields=${OFF_FIELDS}`, 15000);
    list = j.hits || [];
  }
  const seen = new Set();
  return list.map(offToFood).filter(f => f && !seen.has(f.fid) && seen.add(f.fid));
}

function barChart(items, id) {
  const W = 340, H = 170, pl = 34, pr = 6, pt = 10, pb = 22;
  const max = Math.max(1, ...items.map(i => Math.max(i.v, i.t))) * 1.08;
  const nice = max > 3000 ? 1000 : max > 1200 ? 500 : 250;
  const top = Math.ceil(max / nice) * nice;
  const y = v => pt + (H - pt - pb) * (1 - v / top);
  const bw = (W - pl - pr) / items.length;
  const barW = Math.min(26, bw * .56);
  let g = '';
  for (let v = 0; v <= top; v += nice) g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? NF1.format(v / 1000) + ' k' : v}</text>`;
  items.forEach((it, i) => {
    const cx = pl + bw * i + bw / 2, x = cx - barW / 2;
    if (it.v > 0) {
      const yy = y(it.v), h = Math.max(2, H - pb - yy), rr = Math.min(4, h / 2, barW / 2);
      g += `<path d="M${x} ${H - pb} V${yy + rr} Q${x} ${yy} ${x + rr} ${yy} H${x + barW - rr} Q${x + barW} ${yy} ${x + barW} ${yy + rr} V${H - pb} Z" style="fill:var(--${BAR_FILL[it.st] || it.st})" data-bar="${i}" aria-label="${esc(it.detail)}"/>`;
    } else if (it.st === 'open') g += `<rect x="${x}" y="${H - pb - 4}" width="${barW}" height="4" rx="2" style="fill:var(--gray)" data-bar="${i}" aria-label="${esc(it.detail)}"/>`;
    if (it.t > 0) g += `<line class="tgt" x1="${cx - barW / 2 - 4}" x2="${cx + barW / 2 + 4}" y1="${y(it.t)}" y2="${y(it.t)}"/>`;
    if (items.length <= 8 || (items.length - 1 - i) % 2 === 0) g += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${esc(it.label)}</text>`;
    g += `<rect class="hit" x="${pl + bw * i}" y="${pt}" width="${bw}" height="${H - pt}" data-a="chartTap" data-c="${id}" data-i="${i}"><title>${esc(it.detail)}</title></rect>`;
  });
  CHARTS[id] = items;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de barras de calorías">${g}</svg><div class="chart-detail" id="cd-${id}">Toca una barra para ver el detalle.</div>`;
}

function lineChart(pts) {
  const W = 340, H = 150, pl = 34, pr = 10, pt = 12, pb = 22;
  const all = smoothWeights(weightSeries()), tr = all.filter(p => p.k >= pts[0].k && p.k <= pts[pts.length - 1].k);
  const ws = pts.map(p => p.w).concat(tr.map(p => p.w)), mn = Math.min(...ws), mx = Math.max(...ws);
  const lo = Math.floor(mn - .5), hi = Math.ceil(mx + .5);
  const t0 = dateOf(pts[0].k).getTime(), t1 = Math.max(t0 + 864e5, dateOf(pts[pts.length - 1].k).getTime());
  const x = k => pl + (W - pl - pr) * (dateOf(k).getTime() - t0) / (t1 - t0);
  const y = w => pt + (H - pt - pb) * (1 - (w - lo) / (hi - lo));
  let g = '';
  const step = (hi - lo) > 6 ? 2 : 1;
  for (let v = lo; v <= hi; v += step) g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  if (pts.length > 1) g += `<polyline points="${pts.map(p => `${x(p.k)},${y(p.w)}`).join(' ')}" style="fill:none;stroke:var(--leaf);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;opacity:.45"/>`;

  if (tr.length > 1) g += `<polyline points="${tr.map(p => `${x(p.k)},${y(p.w)}`).join(' ')}" style="fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round"/>`;
  g += `<text x="${pl}" y="${H - 6}">${shortDate(pts[0].k)}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end">${shortDate(pts[pts.length - 1].k)}</text>`;

    <div class="legend"><span><i class="sw" style="background:var(--leaf);opacity:.6"></i>Lecturas</span><span><i class="ln" style="height:3px;opacity:1"></i>Tendencia (media de 7 días)</span></div>

/* ---------- copias de seguridad ---------- */
async function exportData() {
  const payload = {app: 'hoja', version: 4, exportedAt: new Date().toISOString(), data: S};
  const name = `hoja-copia-${today()}.json`;
  const blob = new Blob([JSON.stringify(payload)], {type: 'application/json'});
  const mark = () => { S.settings.lastBackup = Date.now(); save(); render(); toast('Copia de seguridad guardada'); };
  try {
    const file = new File([blob], name, {type: 'application/json'});
    if (navigator.canShare && navigator.canShare({files: [file]}) && matchMedia('(pointer: coarse)').matches) {
      await navigator.share({files: [file], title: 'Copia de Hoja'});
      mark(); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  mark();
}
function importData() { const f = $('#importFile'); f.value = ''; f.click(); }
$('#importFile').addEventListener('change', async ev => {
  const file = ev.target.files && ev.target.files[0]; if (!file) return;
  try {
    const j = JSON.parse(await file.text());
    const data = j && j.app === 'hoja' ? j.data : j;
    if (!data || typeof data !== 'object' || !data.settings || !data.days) throw new Error('formato');
    const n = Object.keys(data.days).length;
    const when = j.exportedAt ? ` del ${shortDate(keyOf(new Date(j.exportedAt)))}` : '';
    if (!confirm(`Esta copia${when} tiene ${n} días registrados. Recuperarla reemplazará los datos actuales de este dispositivo. ¿Continuar?`)) return;
    S = migrate(data); S.settings.lastBackup = Date.now(); dirtyIndex(); save(); CUR = today(); render();
    toast('Copia recuperada');
  } catch (e) { toast('Ese archivo no es una copia de Hoja válida'); }
});

  foodMode: a => { FOODMODE = a.dataset.m; FOODQ = ''; render(); },
  foodCat: a => { FOODQ = ''; openCategory(a.dataset.c); },
  newFood: () => openFoodEditor(null),
  editFood: a => openFoodEditor(a.dataset.fid),
  viewBase: a => openBaseFood(a.dataset.fid),
  newRecipe: () => openRecipeEditor(null),
  editRecipe: a => openRecipeEditor(a.dataset.id),
  sex: a => { S.settings.profile.sex = a.dataset.v; save(); renderSettings(); },
  macroMode: a => { S.settings.macroMode = a.dataset.m; save(); renderSettings(); },
  mealMove: a => { const i = +a.dataset.i, j = i + +a.dataset.d, m = S.settings.meals; [m[i], m[j]] = [m[j], m[i]]; save(); renderSettings(); },
  mealDel: a => { const m = S.settings.meals[+a.dataset.i]; if (!confirm(`¿Eliminar «${m.name}» de tus comidas? Lo ya registrado se conserva como «Otras».`)) return; S.settings.meals.splice(+a.dataset.i, 1); save(); renderSettings(); },
  mealAdd: () => { S.settings.meals.push({id: uid('m'), name: 'Nueva comida'}); save(); renderSettings(); const ins = $$('[data-meal]'); const last = ins[ins.length - 1]; last.focus(); last.select(); },
  wipe: () => { if (!confirm('Se borrarán todos tus registros, alimentos y comidas de este dispositivo. ¿Seguro?')) return; if (!confirm('Esta acción no se puede deshacer. ¿Borrar todo?')) return; S = defaultState(); dirtyIndex(); save(); CUR = today(); render(); toast('Datos borrados'); },
};
function openCategory(c) {
  openSheet(c, body => {
    const items = BASE.filter(f => f.c === c).map(f => getFood(f.id)).sort((a, b) => a.n.localeCompare(b.n, 'es'));
    body.innerHTML = `<ul class="rlist">${items.map(f => `<li class="ritem"><div class="rmain" data-s="v" data-fid="${f.fid}"><span class="rname">${esc(f.n)}</span><span class="rsub">${per100Text(f)}, P ${fG(f.p)} C ${fG(f.h)} G ${fG(f.g)}</span></div></li>`).join('')}</ul>`;
    body.addEventListener('click', ev => { const a = ev.target.closest('[data-s]'); if (a) openBaseFood(a.dataset.fid); });
  });
}
document.addEventListener('click', ev => {
  const a = ev.target.closest('[data-a]'); if (!a || a.disabled) return;
  const fn = ACT[a.dataset.a]; if (fn) { ev.preventDefault(); fn(a, ev); }
});
document.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[data-a].entry, .rmain[role="button"]')) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('keydown', ev => { // sin gestos: Supr o Retroceso sobre la fila enfocada
  if ((ev.key !== 'Delete' && ev.key !== 'Backspace') || !ev.target.matches('.entry')) return;
  ev.preventDefault();
  const i = $$('.entry').indexOf(ev.target);
  deleteEntry(CUR, ev.target.dataset.id);
  const rows = $$('.entry'), next = rows[i] || rows[i - 1]; if (next) next.focus();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && TAB === 'hoy' && !sheets.length) render(); });

document.addEventListener('visibilitychange', () => { if (!document.hidden && (!BASE.length || Date.now() - baseChecked > BASE_CHECK_MS)) refreshBase(); });
window.addEventListener('online', () => { if (!BASE.length) refreshBase(); });

/* ---------- inicio ---------- */
(async () => {
  try { await Promise.race([loadLocalBase(), new Promise(ok => setTimeout(ok, 1500))]); } catch (e) {}
  render(); // sin copia guardada se pinta igual: los registros no dependen de la base
  refreshBase();
})();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
