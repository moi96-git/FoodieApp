<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoja</title>
<meta name="description" content="Registro sencillo de comidas, calorías y macronutrientes.">
<meta name="theme-color" content="#F2F6EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1711" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hoja">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#F2F6EE; --surface:#FFFFFF; --surface-2:#E8EFE3; --ink:#1D2B20; --ink-2:#4B5B4E; --ink-3:#77877A; --line:#D7E1D2;
  --leaf:#2E8B4E; --leaf-deep:#1E6A38; --leaf-soft:#D6EAD8; --on-leaf:#FFFFFF;
  --p:#B4405F; --c:#B57A00; --f:#2F76B8;
  --ok:#2E9A55; --warn:#D99A00; --bad:#D04A4A;
  --shadow:0 1px 2px rgba(30,60,35,.06), 0 6px 18px rgba(30,60,35,.06);
  --r-lg:22px; --r:16px; --r-sm:11px;
  --tab-h:62px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1711; --surface:#16211A; --surface-2:#1E2C22; --ink:#E4EEE1; --ink-2:#B0C1B1; --ink-3:#7F9282; --line:#2A3A2E;
    --leaf:#4CB36B; --leaf-deep:#3A9A57; --leaf-soft:#1F3A27; --on-leaf:#0E1711;
    --p:#D9668A; --c:#B88512; --f:#4A8FD4;
    --ok:#4CB36B; --warn:#E0A825; --bad:#E06464;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  font-size:16px; line-height:1.4; -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px);
  overscroll-behavior-y:none;
}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid color-mix(in srgb, var(--leaf) 55%, transparent);outline-offset:2px;border-radius:8px}
.num,.tab-num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px 0}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;margin:12px 0}
@media (prefers-color-scheme: dark){.card{border:1px solid var(--line)}}

/* top bar */
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 2px}
.datebar .dtitle{display:flex;flex-direction:column;align-items:center;min-width:0}
.datebar .dtitle b{font-size:22px;letter-spacing:-.02em}
.datebar .dtitle span{font-size:13px;color:var(--ink-3)}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:active{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px}
.iconbtn[disabled]{opacity:.3;pointer-events:none}

/* hero */
.hero{display:grid;grid-template-columns:118px 1fr;gap:18px;align-items:center;padding:18px 18px 18px 14px}
.leaf{width:118px;height:auto;display:block;overflow:visible}
.leaf .leaf-bg{fill:var(--leaf-soft)}
.leaf .leaf-edge{fill:none;stroke:var(--leaf-deep);stroke-width:2;opacity:.35}
.leaf .leaf-veins{fill:none;stroke:var(--surface);stroke-width:1.6;stroke-linecap:round;opacity:.7}
.leaf .leaf-stem{stroke:var(--leaf-deep);stroke-width:3.2;stroke-linecap:round;fill:none}
.leaf .leaf-fill{transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.leaf.intro .leaf-fill{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(160px)}}
@media (prefers-reduced-motion: reduce){.leaf.intro .leaf-fill,.leaf .leaf-fill{animation:none;transition:none}}
.kcal-big{display:flex;align-items:baseline;gap:6px}
.kcal-big .num{font-size:46px;font-weight:800;letter-spacing:-.035em;line-height:1}
.kcal-big .unit{font-size:16px;color:var(--ink-3);font-weight:600}
.kcal-of{color:var(--ink-2);margin-top:4px}
.kcal-left{margin-top:10px;font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ex-note{display:block;font-size:13px;color:var(--ink-3)}

/* status */
.st{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:800;color:#fff;flex:none;line-height:1}
.st-ok{background:var(--ok)} .st-warn{background:var(--warn)} .st-bad{background:var(--bad)} .st-none{background:var(--line);color:var(--ink-3)}
@media (prefers-color-scheme: dark){.st{color:#0E1711}}
.stlabel{font-size:13px;font-weight:600;color:var(--ink-2)}

/* macros */
.mrow+.mrow{margin-top:14px}
.mhead{display:flex;align-items:center;gap:8px}
.mname{font-weight:650;display:flex;align-items:center;gap:8px;flex:1}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.sw-p{background:var(--p)} .sw-c{background:var(--c)} .sw-f{background:var(--f)}
.mval{color:var(--ink-2);font-variant-numeric:tabular-nums}
.mval b{color:var(--ink)}
.bar{position:relative;height:10px;border-radius:6px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .5s ease}
.bar-target{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-2);opacity:.6}
.mfoot{font-size:13px;color:var(--ink-3);margin-top:5px}

/* duo cards */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.duo .card{margin:0;padding:14px}
.minihead{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--ink-2);font-weight:650;font-size:14px}
.minival{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.minival small{font-size:13px;color:var(--ink-3);font-weight:600;letter-spacing:0}
.water-glasses{display:flex;gap:3px;margin:8px 0 10px;flex-wrap:wrap}
.water-glasses i{width:12px;height:16px;border-radius:2px 2px 4px 4px;background:var(--surface-2);display:block}
.water-glasses i.on{background:#3B8FD0}
.pillrow{display:flex;gap:6px;flex-wrap:wrap}
.pill{border-radius:999px;padding:7px 11px;background:var(--surface-2);font-weight:650;font-size:14px;color:var(--ink)}
.pill:active{filter:brightness(.95)}
.pill.leafy{background:var(--leaf-soft);color:var(--leaf-deep)}
@media (prefers-color-scheme: dark){.pill.leafy{color:var(--leaf)}}

/* meals */
.meal header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.meal h3{font-size:18px;flex:1}
.meal .mk{color:var(--ink-2);font-weight:650;font-variant-numeric:tabular-nums}
.entries{list-style:none;margin:0;padding:0}
.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.entry:first-child{border-top:0}
.entry .en{flex:1;min-width:0}
.entry .nm{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .am{display:block;font-size:13px;color:var(--ink-3)}
.entry .ek{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.entry .ek small.mm{display:flex;justify-content:flex-end;margin-top:2px}
.entry .ek small{display:block;font-weight:500;font-size:12px;color:var(--ink-3)}
.mm{display:inline-flex;gap:8px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mm span{display:inline-flex;align-items:center;gap:3px}
.mm .sw{width:7px;height:7px;border-radius:2px}
.addbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:8px;padding:12px;border-radius:var(--r);background:var(--leaf-soft);color:var(--leaf-deep);font-weight:700}
@media (prefers-color-scheme: dark){.addbtn{color:var(--leaf)}}
.addbtn:active{filter:brightness(.96)}
.addbtn svg{width:18px;height:18px}
.ex-list{margin:6px 0 0;padding:0;list-style:none}
.ex-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ex-list li:first-child{border-top:0}
.ex-list li span{flex:1}

/* banner */
.banner{display:flex;gap:12px;align-items:center;background:var(--leaf-soft);border-radius:var(--r);padding:12px 14px;margin:10px 0}
.banner{flex-wrap:wrap}
.banner p{margin:0;flex:1 1 100%;font-size:14px}
.banner .btn{flex:1}
.banner .btn{padding:9px 12px}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:var(--r);font-weight:700;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--leaf);color:var(--on-leaf)}
.btn.danger{background:transparent;color:var(--bad)}
.btn.block{width:100%}
.btn:active{filter:brightness(.95)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btnrow .btn{flex:1}
.field{display:block;margin:12px 0}
.field>span{display:block;font-size:14px;color:var(--ink-2);font-weight:600;margin-bottom:6px}
.input,select.input{width:100%;padding:12px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);font-size:16px;appearance:none;-webkit-appearance:none}
.input:focus{border-color:var(--leaf);outline:none}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid4 .field{margin:6px 0}
.grid4 .input{padding:11px 8px;text-align:center}
.hint{font-size:13px;color:var(--ink-3);margin:6px 0 0}
.warnline{font-size:13px;color:var(--bad);margin:6px 0 0}

/* segmented */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;margin:10px 0}
.seg{overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:9px 10px;border-radius:9px;font-weight:650;font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-color-scheme: dark){.seg button.on{background:var(--line)}}

/* tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:650;color:var(--ink-3)}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--leaf-deep)}
@media (prefers-color-scheme: dark){.tabbar button.on{color:var(--leaf)}}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50;pointer-events:none}
.sheet-backdrop{position:absolute;inset:0;background:rgba(10,20,12,.38);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:calc(100% - env(safe-area-inset-top) - 24px);display:flex;flex-direction:column;background:var(--bg);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet-wrap.open{pointer-events:auto}
.sheet-wrap.open .sheet-backdrop{opacity:1}
.sheet-wrap.open .sheet{transform:none}
@media (prefers-reduced-motion: reduce){.sheet,.sheet-backdrop{transition:none}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px 12px 6px 18px}
.sheet-head h2{flex:1;font-size:20px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 22px;flex:1}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}

/* search */
.searchbox{position:relative;margin:6px 0 10px}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-3)}
.searchbox .input{padding-left:38px;border-radius:14px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;border-radius:14px;background:var(--surface);font-size:13px;font-weight:650;color:var(--ink-2);border:1px solid var(--line)}
.tool svg{width:22px;height:22px;color:var(--leaf)}
.listtitle{font-size:13px;font-weight:700;color:var(--ink-3);margin:16px 0 4px}
.rlist{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
.ritem{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line)}
.ritem:first-child{border-top:0}
.ritem .rmain{flex:1;min-width:0;cursor:pointer}
.ritem .rname{display:block;font-weight:600;line-height:1.25}
.ritem .rsub{display:block;font-size:13px;color:var(--ink-3);margin-top:2px}
.ritem .quick{width:36px;height:36px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf-deep);display:grid;place-items:center;flex:none}
@media (prefers-color-scheme: dark){.ritem .quick{color:var(--leaf)}}
.ritem .quick svg{width:18px;height:18px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);vertical-align:1px;margin-left:4px}
.empty{padding:22px 10px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink-2);margin-bottom:4px}

/* quantity */
.per100{font-size:14px;color:var(--ink-3);margin:2px 0 6px}
.qtyline{display:flex;align-items:center;gap:10px;margin:8px 0}
.qtyline .input{text-align:center;font-size:24px;font-weight:750;padding:10px}
.qtyline .unitlbl{min-width:58px;color:var(--ink-2);font-weight:650}
.step{width:48px;height:48px;border-radius:14px;background:var(--surface-2);font-size:24px;font-weight:700;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.chip{padding:8px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:650;font-size:15px}
.chip.on{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf)}
.preview{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;background:var(--surface);border-radius:var(--r);padding:12px;border:1px solid var(--line)}
.preview div{text-align:center}
.preview b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.preview span{font-size:12px;color:var(--ink-3);display:inline-flex;align-items:center;gap:4px}
.preview .sw{width:7px;height:7px}

/* scanner */
.scanbox{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:4/3}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .aim{position:absolute;left:10%;right:10%;top:38%;height:24%;border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}

/* summary */
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface-2);border-radius:var(--r);padding:12px}
.stat .lbl{font-size:13px;color:var(--ink-2);font-weight:650;display:flex;align-items:center;gap:6px}
.stat .val{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .val small{font-size:13px;color:var(--ink-3);font-weight:600;letter-spacing:0}
.stat .sub{font-size:12px;color:var(--ink-3)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-size:11px;fill:var(--ink-3);font-family:inherit}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tgt{stroke:var(--ink);stroke-width:2;stroke-linecap:round;opacity:.55}
.chart .hit{fill:transparent;cursor:pointer}
.chart .sel{opacity:1}
.chart-detail{min-height:22px;font-size:14px;color:var(--ink-2);margin-top:6px;text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ln{width:14px;height:2px;background:var(--ink);opacity:.55;border-radius:1px}
.dotgrid{display:grid;grid-template-columns:96px repeat(7,1fr);gap:6px 4px;align-items:center;font-size:13px}
.dotgrid .h{text-align:center;color:var(--ink-3);font-weight:650;font-size:12px}
.dotgrid .rl{color:var(--ink-2);font-weight:650;display:flex;align-items:center;gap:6px}
.dotgrid .c{display:grid;place-items:center}
.splitbar{display:flex;height:16px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.splitbar span{display:block;height:100%}
.splitrow{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;margin:8px 0;font-size:13px;color:var(--ink-2)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-size:12px;color:var(--ink-3);font-weight:650;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:right}
.tbl tr:last-child td{border-bottom:0}
.mealbars .row{display:grid;grid-template-columns:96px 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mealbars .track{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.mealbars .track span{display:block;height:100%;background:var(--leaf);border-radius:6px}
.mealbars .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.section-title{font-size:17px;margin:4px 0 10px}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0 2px}
.pagehead h1{font-size:28px;letter-spacing:-.025em}

/* settings */
.mealedit{display:flex;gap:6px;align-items:center;margin:6px 0}
.mealedit .input{flex:1;padding:10px 12px}
.mealedit .iconbtn{width:38px;height:38px}
.range{width:100%;accent-color:var(--leaf);margin:10px 0 2px}
.rangelbl{display:flex;justify-content:space-between;font-size:14px;font-weight:650}
.rangelbl .c{color:var(--c)} .rangelbl .f{color:var(--f)}
.about{font-size:13px;color:var(--ink-3)}
.about a{color:var(--leaf-deep)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,20px);opacity:0;z-index:80;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:14px;font-weight:600;font-size:14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--leaf-soft);font-weight:800}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main class="wrap" id="view"></main>

const BASE_MAP = new Map(BASE.map(f => [f.id, f]));

function getFood(fid) {
  if (!fid) return null;
  if (S.foods[fid]) return toFood(S.foods[fid], fid, S.foods[fid].src || 'user');
  const b = BASE_MAP.get(fid); return b ? toFood(b, fid, b.src === 'es' ? 'es' : 'base') : null;
}
let INDEX = null;
function index() {
  if (INDEX) return INDEX;
  INDEX = [];
  for (const fid in S.foods) INDEX.push({f: getFood(fid), nn: norm(S.foods[fid].n + ' ' + (S.foods[fid].code || ''))});
  for (const b of BASE) INDEX.push({f: getFood(b.id), nn: norm(b.n)});

const dirtyIndex = () => { INDEX = null; };
function search(q, limit = 40) {
  const toks = norm(q).split(/\s+/).filter(Boolean);
  if (!toks.length) return [];
  const out = [];
  for (const it of index()) {
    let sc = 0, ok = true;
    for (const w of toks) {
      const i = it.nn.indexOf(w);
      if (i < 0) { ok = false; break; }
      sc += i === 0 ? 6 : /[\s(/]/.test(it.nn[i-1]) ? 3 : 1;
    }
    if (!ok) continue;
    const u = S.usage[it.f.fid];
    if (u) sc += Math.min(6, Math.log2(1 + u.n) * 2);
    if (it.f.src === 'user' || it.f.src === 'off') sc += 1;
    sc -= it.nn.length / 60;

function day(k, create) {

}

    const u = S.usage[food.fid] || (S.usage[food.fid] = {n: 0, m: {}});
    u.n++; u.t = Date.now(); u.m[meal] = (u.m[meal] || 0) + 1; u.q = e.q; u.unit = unit || null;

/* ---------- hojas (bottom sheets) ---------- */
const sheets = [];
function openSheet(title, build, opts = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="sheet-backdrop"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="grab" aria-hidden="true"></div>

    <div class="sheet-body"></div></div>`;
  document.body.appendChild(wrap);
  const rec = {wrap, cleanup: null};
  sheets.push(rec);
  wrap.querySelector('.sheet-backdrop').onclick = () => closeSheet();
  wrap.querySelector('[data-s="close"]').onclick = () => opts.closeAll ? closeAll() : closeSheet();
  const bk = wrap.querySelector('[data-s="back"]'); if (bk) bk.onclick = () => closeSheet();
  build(wrap.querySelector('.sheet-body'), rec);
  document.body.classList.add('noscroll');
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('open')));
  return rec;
}
function closeSheet() {
  const s = sheets.pop(); if (!s) return;
  if (s.cleanup) try { s.cleanup(); } catch (e) {}
  s.wrap.classList.remove('open');
  setTimeout(() => s.wrap.remove(), 260);
  if (!sheets.length) document.body.classList.remove('noscroll');
}
function closeAll() { while (sheets.length) closeSheet(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheets.length) closeSheet(); });

}

        const e = addEntry(CUR, meal, f, q, unit);
        render();
        toast(`Añadido: ${f.n.length > 26 ? f.n.slice(0, 25) + '…' : f.n}, ${fG(q)} g`, {label: 'Deshacer', fn: () => { removeEntry(CUR, e.id); render(); }});
        rec.refresh && rec.refresh();
      },
      onRecipe: r => { addRecipe(r, meal); closeAll(); }
    }, rec);
  });
}
function addRecipe(r, meal) {
  for (const it of r.items) {
    const f = getFood(it.fid) || {fid: null, n: it.n, k: it.k, p: it.p, h: it.h, g: it.g};
    addEntry(CUR, meal, f, it.q, it.u || null);
  }
  render();
  toast(`Añadida «${r.name}» (${r.items.length} alimentos)`);
}
function foodRow(f, quick) {
  const tag = f.src === 'user' ? '<span class="tag">Mío</span>' : f.src === 'off' ? '<span class="tag">Producto</span>' : '';
  return `<li class="ritem"><div class="rmain" data-s="pick" data-fid="${esc(f.fid)}" role="button" tabindex="0"><span class="rname">${esc(f.n)}${tag}</span><span class="rsub">${per100Text(f)}, P ${fG(f.p)} C ${fG(f.h)} G ${fG(f.g)}</span></div>
    ${quick ? `<button class="quick" data-s="quick" data-fid="${esc(f.fid)}" aria-label="Añadir ${esc(f.n)} con la cantidad habitual">${ICON.plus}</button>` : ''}</li>`;
}
function mountSearch(body, o, rec) {
  body.innerHTML = `
    <div class="searchbox">${ICON.search}<input class="input" type="search" placeholder="Buscar alimento" autocomplete="off" enterkeyhint="search" aria-label="Buscar alimento"></div>
    ${o.tools ? `<div class="tools">
      <button class="tool" data-s="scan">${ICON.scan}Escanear</button>
      <button class="tool" data-s="quickmacros">${ICON.macros}Macros directos</button>
      <button class="tool" data-s="newfood">${ICON.newfood}Crear alimento</button></div>` : ''}
    <div class="results"></div>`;
  const inp = $('input', body), res = $('.results', body);
  let offItems = new Map(), lastQ = '';
  const draw = () => {
    const q = inp.value.trim(); lastQ = q;
    let html = '';
    const quick = !!o.onQuick;
    if (!q) {
      if (o.onRecipe && S.recipes.length) html += `<div class="listtitle">Mis comidas</div><ul class="rlist">${S.recipes.map(r => { const t = recipeTotals(r); return `<li class="ritem"><div class="rmain" data-s="recipe" data-id="${r.id}" role="button" tabindex="0"><span class="rname">${esc(r.name)}</span><span class="rsub">${r.items.length} alimentos, ${fInt(t.k)} kcal</span></div><button class="quick" data-s="recipe" data-id="${r.id}" aria-label="Añadir ${esc(r.name)}">${ICON.plus}</button></li>`; }).join('')}</ul>`;
      let fr = frequent(o.meal);
      const title = fr.length ? 'Los que más usas' : 'Para empezar';
      if (!fr.length) fr = STARTERS.map(getFood).filter(Boolean);
      html += `<div class="listtitle">${title}</div><ul class="rlist">${fr.map(f => foodRow(f, quick)).join('')}</ul>`;
    } else {
      const list = search(q);
      html += list.length ? `<ul class="rlist">${list.map(f => foodRow(f, quick)).join('')}</ul>` : `<div class="empty"><b>Sin resultados en tu base</b>Prueba otra palabra, busca en Open Food Facts o crea el alimento.</div>`;
      html += `<div class="btnrow"><button class="btn block" data-s="off">Buscar «${esc(q.length > 22 ? q.slice(0, 21) + '…' : q)}» en Open Food Facts</button></div><div class="offres"></div>`;
    }
    res.innerHTML = html;
  };
  rec.refresh = draw;
  let tmr; inp.addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(draw, 90); });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
  body.addEventListener('click', async ev => {
    const a = ev.target.closest('[data-s]'); if (!a) return;
    const s = a.dataset.s;
    const resolve = fid => getFood(fid) || offItems.get(fid);
    if (s === 'pick') { const f = resolve(a.dataset.fid); f && o.onPick(f); }
    else if (s === 'quick') { const f = resolve(a.dataset.fid); f && o.onQuick(f); }
    else if (s === 'recipe') { const r = S.recipes.find(r => r.id === a.dataset.id); r && o.onRecipe(r); }
    else if (s === 'scan') openScanner(o.meal);
    else if (s === 'quickmacros') openQuickMacros({meal: o.meal});
    else if (s === 'newfood') openFoodEditor(null, {name: inp.value.trim(), after: f => o.onPick(f)});
    else if (s === 'off') {
      const box = $('.offres', body), q = inp.value.trim();
      a.disabled = true; a.textContent = 'Buscando…';

        const items = await offSearch(q);
        if (q !== lastQ) return;
        items.forEach(f => offItems.set(f.fid, f));
        box.innerHTML = items.length ? `<div class="listtitle">Open Food Facts</div><ul class="rlist">${items.map(f => foodRow(f, false)).join('')}</ul>` : `<div class="empty"><b>Sin resultados en Open Food Facts</b>Revisa la ortografía o crea el alimento con los datos de la etiqueta.</div>`;

}

/* ---------- cantidad ---------- */
function openQty(food, o) {
  // o: {meal, entry (edit), date, onDone, title}
  const editing = !!o.entry;
  const units = food.u || [];
  let grams = editing ? o.entry.q : (S.usage[food.fid] && S.usage[food.fid].q) || 100;
  let mode = 'x';
  let unitIdx = -1;
  const prevUnit = editing ? o.entry.u : (S.usage[food.fid] && S.usage[food.fid].unit);
  if (prevUnit) { const i = units.findIndex(u => u[0] === prevUnit.l); if (i >= 0) { mode = 'u'; unitIdx = i; } }
  let meal = o.meal || (o.entry && o.entry.m) || S.settings.meals[0].id;
  openSheet(editing ? 'Editar' : food.n, (body, rec) => {
    const draw = () => {
      const unit = mode === 'u' ? units[unitIdx] : null;
      const val = mode === 'x' ? grams / 100 : mode === 'g' ? grams : grams / unit[1];
      const r = {k: food.k * grams / 100, p: food.p * grams / 100, c: food.h * grams / 100, f: food.g * grams / 100};
      const chips = mode === 'x' ? [[.25,'¼'],[.5,'½'],[.75,'¾'],[1,'1'],[1.5,'1½'],[2,'2'],[3,'3']] : mode === 'g' ? [[30,'30'],[50,'50'],[100,'100'],[150,'150'],[200,'200'],[250,'250']] : [[.5,'½'],[1,'1'],[2,'2'],[3,'3'],[4,'4']];
      const lbl = mode === 'x' ? '× 100 g' : mode === 'g' ? 'gramos' : unit[0].replace(/^1\s+/, '');
      body.innerHTML = `
        ${editing ? `<div style="font-weight:700;font-size:18px">${esc(food.n)}</div>` : ''}
        <div class="per100">Por 100 g: ${fInt(food.k)} kcal, P ${fG(food.p)} g, C ${fG(food.h)} g, G ${fG(food.g)} g</div>
        <div class="seg" role="tablist">
          <button data-s="mode" data-m="x" class="${mode === 'x' ? 'on' : ''}">× 100 g</button>
          <button data-s="mode" data-m="g" class="${mode === 'g' ? 'on' : ''}">Gramos</button>
          ${units.map((u, i) => `<button data-s="mode" data-m="u" data-i="${i}" class="${mode === 'u' && unitIdx === i ? 'on' : ''}">${esc(u[0].replace(/^1\s+/, ''))}</button>`).join('')}
        </div>
        <div class="qtyline">
          <button class="step" data-s="dec" aria-label="Menos">−</button>
          <input class="input" inputmode="decimal" value="${NF1.format(r1(val)).replace(/\./g,'')}" aria-label="Cantidad en ${lbl}">
          <span class="unitlbl">${esc(lbl)}</span>
          <button class="step" data-s="inc" aria-label="Más">+</button>
        </div>
        <div class="chips">${chips.map(c => `<button class="chip ${Math.abs(val - c[0]) < 1e-6 ? 'on' : ''}" data-s="chip" data-v="${c[0]}">${c[1]}</button>`).join('')}</div>
        ${mode !== 'g' ? `<p class="hint" style="margin:-4px 0 10px">${fG(grams)} g en total</p>` : ''}
        <div class="preview" aria-live="polite">
          <div><b>${fInt(r.k)}</b><span>kcal</span></div>
          <div><b>${fG(r.p)}</b><span><i class="sw sw-p"></i>Prot.</span></div>
          <div><b>${fG(r.c)}</b><span><i class="sw sw-c"></i>Carb.</span></div>
          <div><b>${fG(r.f)}</b><span><i class="sw sw-f"></i>Grasa</span></div>
        </div>
        ${o.pickOnly ? '' : `<label class="field"><span>Comida</span><select class="input" data-s="meal">${S.settings.meals.map(m => `<option value="${m.id}" ${m.id === meal ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select></label>`}
        <div class="btnrow">${editing ? `<button class="btn danger" data-s="del">Eliminar</button>` : ''}<button class="btn primary" data-s="ok" ${grams > 0 ? '' : 'disabled'}>${editing ? 'Guardar' : o.okLabel || 'Añadir'}</button></div>`;
      const inp = $('.qtyline input', body);
      inp.addEventListener('input', () => {
        const v = parseNum(inp.value);
        if (isFinite(v) && v >= 0) { grams = mode === 'x' ? v * 100 : mode === 'g' ? v : v * units[unitIdx][1]; refreshPreview(); }
      });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { inp.blur(); } });
    };
    const refreshPreview = () => {
      const b = $$('.preview b', body); if (!b.length) return;
      b[0].textContent = fInt(food.k * grams / 100); b[1].textContent = fG(food.p * grams / 100); b[2].textContent = fG(food.h * grams / 100); b[3].textContent = fG(food.g * grams / 100);
      const h = $('.hint', body); if (h && mode !== 'g') h.textContent = `${fG(grams)} g en total`;
      const ok = $('[data-s="ok"]', body); if (ok) ok.disabled = !(grams > 0);
      const unitG = mode === 'x' ? 100 : mode === 'g' ? 1 : units[unitIdx][1];
      $$('.chip', body).forEach(c => c.classList.toggle('on', Math.abs(grams / unitG - +c.dataset.v) < 1e-6));
    };
    body.addEventListener('click', ev => {
      const a = ev.target.closest('[data-s]'); if (!a) return;
      const s = a.dataset.s;
      const unitG = mode === 'x' ? 100 : mode === 'g' ? 1 : units[unitIdx][1];
      const stepV = mode === 'x' ? .25 : mode === 'g' ? 10 : .5;
      if (s === 'mode') { mode = a.dataset.m; unitIdx = mode === 'u' ? +a.dataset.i : -1; if (mode === 'u') { const ug = units[unitIdx][1]; grams = ug * Math.max(1, Math.round(grams / ug)); } draw(); }
      else if (s === 'chip') { grams = +a.dataset.v * unitG; draw(); }
      else if (s === 'inc') { const v = grams / unitG; grams = (Math.floor(v / stepV + 1e-6) + 1) * stepV * unitG; draw(); }
      else if (s === 'dec') { const v = grams / unitG; grams = Math.max(0, (Math.ceil(v / stepV - 1e-6) - 1) * stepV * unitG); draw(); }
      else if (s === 'del') { removeEntry(o.date || CUR, o.entry.id); closeAll(); render(); toast('Eliminado'); }
      else if (s === 'ok') {
        const unit = mode === 'u' ? {l: units[unitIdx][0], n: r1(grams / units[unitIdx][1]), g: units[unitIdx][1]} : null;
        if (o.onDone) { o.onDone(food, grams, unit); return; }
        if (editing) {
          const e = o.entry; e.q = r1(grams); e.m = meal; if (unit) e.u = unit; else delete e.u;
          if (e.fid && S.usage[e.fid]) { S.usage[e.fid].q = e.q; S.usage[e.fid].unit = unit; }
          save(); closeAll(); render(); toast('Guardado');
        } else {
          addEntry(CUR, meal, food, grams, unit); closeAll(); render();
          toast(`Añadido a ${mealName(meal)}`);
        }
      }
    });
    body.addEventListener('change', ev => { if (ev.target.dataset.s === 'meal') meal = ev.target.value; });
    draw();
  }, {back: !editing && !o.noBack, closeAll: !o.onDone});
}

/* ---------- Open Food Facts ---------- */
const OFF = 'https://world.openfoodfacts.org';
const OFF_FIELDS = 'code,product_name,product_name_es,generic_name_es,brands,nutriments,serving_quantity';
async function fetchJSON(url, ms = 12000) {
  const ac = new AbortController(); const t = setTimeout(() => ac.abort(), ms);
  try { const r = await fetch(url, {signal: ac.signal}); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
function offToFood(p) {
  if (!p) return null;
  const n = p.nutriments || {};
  let k = n['energy-kcal_100g'];
  if (k == null && n['energy_100g'] != null) k = n['energy_100g'] / 4.184;
  if (k == null && n.proteins_100g == null && n.carbohydrates_100g == null) return null;
  const name = (p.product_name_es || p.product_name || p.generic_name_es || '').trim();
  if (!name) return null;
  const brand = (p.brands || '').split(',')[0].trim();
  const f = {fid: 'off' + p.code, n: brand && !norm(name).includes(norm(brand)) ? `${name} (${brand})` : name, c: 'Productos', k: Math.round(+k || 0), p: r1(n.proteins_100g), h: r1(n.carbohydrates_100g), g: r1(n.fat_100g), u: [], src: 'off', code: String(p.code || '')};
  const sq = parseFloat(p.serving_quantity); if (sq > 0) f.u = [['1 ración', r1(sq)]];
  return f;
}
async function offProduct(code) {
  const j = await fetchJSON(`${OFF}/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`);
  return j && j.status === 1 ? offToFood(j.product) : null;
}
async function offSearch(q) {
  let list;
  try {
    const j = await fetchJSON(`${OFF}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=25&lc=es&fields=${OFF_FIELDS}`, 15000);
    list = j.products || [];
  } catch (e) {
    // Alternativa: el nuevo buscador de Open Food Facts (Search-a-licious)
    const j = await fetchJSON(`https://search.openfoodfacts.org/search?q=${encodeURIComponent(q)}&page_size=25&langs=es&fields=${OFF_FIELDS}`, 15000);
    list = j.hits || [];
  }
  const seen = new Set();
  return list.map(offToFood).filter(f => f && !seen.has(f.fid) && seen.add(f.fid));
}

/* ---------- escáner ---------- */
function loadScript(src) { return new Promise((ok, ko) => { if (window.ZXing) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('script')); document.head.appendChild(s); }); }
function openScanner(meal) {
  openSheet('Escanear código de barras', (body, rec) => {
    body.innerHTML = `
      <div class="scanbox"><video playsinline muted autoplay></video><div class="aim" aria-hidden="true"></div></div>
      <p class="hint" data-msg>Apunta al código de barras del envase.</p>
      <div class="field"><span>O escribe el código</span><div style="display:flex;gap:8px"><input class="input" inputmode="numeric" data-code placeholder="8412345678901"><button class="btn primary" data-s="find">Buscar</button></div></div>`;
    const video = $('video', body), msg = $('[data-msg]', body);
    let stream = null, reader = null, raf = 0, stopped = false, busy = false;
    const stop = () => { stopped = true; cancelAnimationFrame(raf); if (reader) try { reader.reset(); } catch (e) {} if (stream) stream.getTracks().forEach(t => t.stop()); if (video.srcObject) { video.srcObject.getTracks && video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; } };
    rec.cleanup = stop;
    const found = async code => {
      if (busy) return; busy = true;
      msg.textContent = `Código ${code}. Buscando el producto…`;
      const local = Object.entries(S.foods).find(([, f]) => f.code === code);
      if (local) { stop(); closeSheet(); openQty(getFood(local[0]), {meal}); return; }
      try {
        const f = await offProduct(code);
        if (f) { stop(); closeSheet(); openQty(f, {meal}); }
        else { msg.innerHTML = `No encontramos el código ${esc(code)} en Open Food Facts. <button class="btn" data-s="create" data-code="${esc(code)}" style="margin-top:8px">Crear alimento con este código</button>`; busy = false; }
      } catch (e) { msg.textContent = 'No se pudo conectar con Open Food Facts. Revisa tu conexión e inténtalo de nuevo.'; busy = false; }
    };
    body.addEventListener('click', ev => {
      const a = ev.target.closest('[data-s]'); if (!a) return;
      if (a.dataset.s === 'find') { const c = $('[data-code]', body).value.replace(/\D/g, ''); if (c.length >= 6) found(c); else toast('Escribe un código de al menos 6 dígitos'); }
      if (a.dataset.s === 'create') { stop(); closeSheet(); openFoodEditor(null, {prefill: {code: a.dataset.code}, after: f => openQty(f, {meal})}); }
    });
    (async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { msg.textContent = 'Este navegador no permite usar la cámara. Escribe el código a mano.'; return; }
      try {
        if ('BarcodeDetector' in window) {
          const det = new BarcodeDetector({formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128']});
          stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}, audio: false});
          if (stopped) return stop();
          video.srcObject = stream; await video.play();
          let last = 0;
          const loop = async ts => {
            if (stopped) return;
            if (ts - last > 220 && video.readyState >= 2) { last = ts; try { const r = await det.detect(video); if (r && r[0]) { found(r[0].rawValue); } } catch (e) {} }
            raf = requestAnimationFrame(loop);
          };
          raf = requestAnimationFrame(loop);
        } else {
          msg.textContent = 'Preparando la cámara…';
          await loadScript('vendor/zxing.min.js');
          if (stopped) return;
          const hints = new Map();
          hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_128]);
          reader = new ZXing.BrowserMultiFormatReader(hints, 250);
          msg.textContent = 'Apunta al código de barras del envase.';
          reader.decodeFromConstraints({video: {facingMode: 'environment'}, audio: false}, video, (res) => { if (res && !stopped) found(res.getText()); }).catch(() => { msg.textContent = 'No se pudo abrir la cámara. Revisa los permisos o escribe el código.'; });
        }
      } catch (e) {
        msg.textContent = e && e.name === 'NotAllowedError' ? 'No hay permiso para usar la cámara. Actívalo en los ajustes del navegador o escribe el código.' : 'No se pudo abrir la cámara. Escribe el código a mano.';
      }
    })();
  }, {back: true, closeAll: true});
}

/* ---------- comidas guardadas (recetas) ---------- */
function recipeTotals(r) { return totals(r.items); }
function openRecipeEditor(id, preset) {
  const ex = id ? S.recipes.find(r => r.id === id) : null;
  const work = ex ? JSON.parse(JSON.stringify(ex)) : {id: uid('r'), name: preset ? preset.name : '', items: preset ? preset.items : []};
  openSheet(ex ? 'Editar comida' : 'Nueva comida', (body, rec) => {
    const draw = () => {
      const t = recipeTotals(work);
      body.innerHTML = `
        <p class="hint" style="margin-top:0">Guarda una combinación de alimentos para añadirla después con un toque.</p>
        <label class="field"><span>Nombre</span><input class="input" data-k="name" value="${esc(work.name)}" placeholder="Por ejemplo: Desayuno de avena"></label>
        <div class="listtitle">Alimentos</div>
        ${work.items.length ? `<ul class="rlist">${work.items.map((it, i) => `<li class="ritem"><div class="rmain"><span class="rname">${esc(it.n)}</span><span class="rsub">${fInt(etot(it).k)} kcal</span></div>
          <input class="input" style="width:84px;text-align:center;padding:9px 6px" inputmode="decimal" data-q="${i}" value="${NF1.format(it.q).replace(/\./g,'')}" aria-label="Gramos de ${esc(it.n)}"><span class="muted small">g</span>
          <button class="iconbtn" data-s="rm" data-i="${i}" aria-label="Quitar ${esc(it.n)}">${ICON.close}</button></li>`).join('')}</ul>` : `<div class="empty">Todavía no hay alimentos.</div>`}
        <button class="addbtn" data-s="additem">${ICON.plus}Añadir alimento</button>
        <div class="preview" style="margin-top:14px">
          <div><b>${fInt(t.k)}</b><span>kcal</span></div><div><b>${fG(t.p)}</b><span><i class="sw sw-p"></i>Prot.</span></div><div><b>${fG(t.c)}</b><span><i class="sw sw-c"></i>Carb.</span></div><div><b>${fG(t.f)}</b><span><i class="sw sw-f"></i>Grasa</span></div>
        </div>
        <div class="btnrow">${ex ? '<button class="btn danger" data-s="del">Eliminar</button>' : ''}<button class="btn primary" data-s="ok">Guardar comida</button></div>`;
    };
    rec.redraw = draw;
    body.addEventListener('input', ev => {
      if (ev.target.dataset.k === 'name') work.name = ev.target.value;
      if (ev.target.dataset.q != null) { const v = parseNum(ev.target.value); if (v > 0) { work.items[+ev.target.dataset.q].q = r1(v); } }
    });
    body.addEventListener('change', ev => { if (ev.target.dataset.q != null) draw(); });
    body.addEventListener('click', ev => {
      const a = ev.target.closest('[data-s]'); if (!a) return;
      const s = a.dataset.s;
      if (s === 'rm') { work.items.splice(+a.dataset.i, 1); draw(); }
      else if (s === 'additem') {
        openSheet('Añadir a la comida', (b2, r2) => mountSearch(b2, {
          onPick: f => openQty(f, {pickOnly: true, okLabel: 'Añadir a la comida', onDone: (food, grams, unit) => {
            const it = {fid: food.fid, n: food.n, k: food.k, p: food.p, h: food.h, g: food.g, q: r1(grams)}; if (unit) it.u = unit;
            if (food.src === 'off' && !S.foods[food.fid]) { S.foods[food.fid] = {n: food.n, c: 'Productos', k: food.k, p: food.p, h: food.h, g: food.g, u: food.u || [], src: 'off', code: food.code}; dirtyIndex(); save(); }
            work.items.push(it); closeSheet(); closeSheet(); draw();
          }})
        }, r2), {back: true});
      }
      else if (s === 'del') { if (!confirm(`¿Eliminar «${work.name}»?`)) return; S.recipes = S.recipes.filter(r => r.id !== work.id); save(); closeSheet(); render(); toast('Comida eliminada'); }
      else if (s === 'ok') {
        work.name = work.name.trim();
        if (!work.name) { toast('Escribe un nombre para la comida'); return; }
        if (!work.items.length) { toast('Añade al menos un alimento'); return; }
        const i = S.recipes.findIndex(r => r.id === work.id);
        if (i >= 0) S.recipes[i] = work; else S.recipes.push(work);
        save(); closeSheet(); render(); toast(ex ? 'Comida guardada' : `«${work.name}» guardada en Mis comidas`);
      }
    });
    draw();
  });
}

/* ---------- vista Resumen ---------- */
function weekDays(mon) { return Array.from({length: 7}, (_, i) => addDays(mon, i)); }
function renderSummary() {
  const segs = [['dia', 'Día'], ['semana', 'Semana'], ['historial', 'Historial']];
  let html = `<div class="pagehead"><h1>Resumen</h1></div>
    <div class="seg" role="tablist">${segs.map(([k, l]) => `<button data-a="sumMode" data-m="${k}" class="${SUMMODE === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  if (SUMMODE === 'dia') html += summaryDay();
  else if (SUMMODE === 'semana') html += summaryWeek();
  else html += summaryHistory();
  $('#view').innerHTML = html;
}
function summaryDay() {
  const k = SUMD, t = dayTotals(k), T = targets(k), d = day(k);
  const head = `<div class="datebar"><button class="iconbtn" data-a="sumDay" data-n="-1" aria-label="Día anterior">${ICON.left}</button><div class="dtitle"><b>${dayName(k)}</b><span>${shortDate(k)}</span></div><button class="iconbtn" data-a="sumDay" data-n="1" aria-label="Día siguiente">${ICON.right}</button></div>`;
  if (!d.entries.length && !d.water && d.weight == null && !d.ex.length) return head + `<div class="card empty"><b>Sin registros este día</b>Añade alimentos desde la pestaña Hoy.</div>`;
  const rows = [['Calorías', 'k', t.k, T.k, 'kcal'], ['Proteína', 'p', t.p, T.p, 'g'], ['Carbohidratos', 'c', t.c, T.c, 'g'], ['Grasas', 'f', t.f, T.f, 'g']];
  const kc = {p: t.p * 4, c: t.c * 4, f: t.f * 9}, ks = kc.p + kc.c + kc.f || 1;
  const kt = {p: T.p * 4, c: T.c * 4, f: T.f * 9}, kts = kt.p + kt.c + kt.f || 1;
  const split = (o, s) => ['p', 'c', 'f'].map(m => `<span style="width:${o[m] / s * 100}%;background:var(--${m})" title="${Math.round(o[m] / s * 100)} %"></span>`).join('');

      <div class="splitrow"><span>Objetivo</span><div class="splitbar" role="img" aria-label="Objetivo: proteína ${Math.round(kt.p / kts * 100)} %, carbohidratos ${Math.round(kt.c / kts * 100)} %, grasas ${Math.round(kt.f / kts * 100)} %">${split(kt, kts)}</div></div>
      <div class="legend"><span><i class="sw sw-p"></i>Proteína ${Math.round(kc.p / ks * 100)} %</span><span><i class="sw sw-c"></i>Carbohidratos ${Math.round(kc.c / ks * 100)} %</span><span><i class="sw sw-f"></i>Grasas ${Math.round(kc.f / ks * 100)} %</span></div>

      <h2 class="section-title">Por comida</h2>

function summaryWeek() {

  if (!logged.length) return head + `<div class="card empty"><b>Sin registros esta semana</b>Cuando registres comidas verás aquí la evolución día a día.</div>`;
  const avg = key => logged.reduce((a, x) => a + x.t[key], 0) / logged.length;
  const avgT = key => logged.reduce((a, x) => a + x.T[key], 0) / logged.length;

  const bars = data.map(x => ({label: DIAS[dateOf(x.k).getDay()], v: x.t.k, t: x.T.k, st: x.t.n ? status(x.t.k, x.T.k) : 'none', detail: x.t.n ? `${shortDate(x.k)}: ${fInt(x.t.k)} de ${fInt(x.T.k)} kcal, ${ST_TXT[status(x.t.k, x.T.k)].toLowerCase()}` : `${shortDate(x.k)}: sin registros`}));

  return head + `
    <section class="card">
      <div class="statgrid">

    </section>
    <section class="card">
      <h2 class="section-title">Semáforo de la semana</h2>
      <div class="dotgrid"><span></span>${days.map(k => `<span class="h">${DIAS[dateOf(k).getDay()]}</span>`).join('')}
      ${grid.map(([l, key]) => `<span class="rl">${key !== 'k' ? `<i class="sw sw-${key}"></i>` : ''}${l}</span>${data.map(x => `<span class="c">${x.t.n ? stDot(status(x.t[key], x.T[key], key === 'p')) : '<span class="st st-none" aria-label="Sin registros">–</span>'}</span>`).join('')}`).join('')}
      </div>
    </section>
    <section class="card">
      <h2 class="section-title">Promedios frente al objetivo</h2>
      <table class="tbl"><thead><tr><th>Nutriente</th><th>Media</th><th>Objetivo</th><th></th></tr></thead><tbody>
      ${[['Proteína', 'p'], ['Carbohidratos', 'c'], ['Grasas', 'f']].map(([l, key]) => `<tr><td><span class="mname" style="display:inline-flex"><i class="sw sw-${key}"></i>${l}</span></td><td>${fG(avg(key))} g</td><td>${fG(avgT(key))} g</td><td>${stDot(status(avg(key), avgT(key), key === 'p'))}</td></tr>`).join('')}
      </tbody></table>
    </section>
    <section class="card"><div class="statgrid">
      <div class="stat"><div class="lbl">Agua media</div><div class="val">${water.length ? fInt(water.reduce((a, x) => a + x.t.water, 0) / water.length) : '–'} <small>ml</small></div><div class="sub">${water.length} días con registro</div></div>
      <div class="stat"><div class="lbl">Peso</div><div class="val">${weights.length ? NF1.format(weights[weights.length - 1].t.weight) + ' <small>kg</small>' : '–'}</div><div class="sub">${weights.length > 1 ? deltaText(weights[weights.length - 1].t.weight - weights[0].t.weight, weights[0].k) : weights.length ? 'Un registro' : 'Sin registros'}</div></div>
    </div></section>`;
}
function summaryHistory() {
  const cur = mondayOf(today());
  const weeks = Array.from({length: 12}, (_, i) => addDays(cur, -7 * (11 - i)));
  const rows = weeks.map(mon => {
    const data = weekDays(mon).map(k => ({k, t: dayTotals(k), T: targets(k)})).filter(x => x.t.n > 0);
    const n = data.length;
    const avg = key => n ? data.reduce((a, x) => a + x.t[key], 0) / n : 0;
    const avgT = key => n ? data.reduce((a, x) => a + x.T[key], 0) / n : 0;
    return {mon, n, k: avg('k'), kt: avgT('k'), p: avg('p'), pt: avgT('p'), ok: data.filter(x => status(x.t.k, x.T.k) === 'ok').length};
  });
  const withData = rows.filter(r => r.n);
  const wts = Object.keys(S.days).filter(k => S.days[k].weight != null && k >= addDays(cur, -7 * 11)).sort().map(k => ({k, w: S.days[k].weight}));
  if (!withData.length && !wts.length) return `<div class="card empty"><b>Todavía no hay historial</b>Aquí verás tus últimas 12 semanas en cuanto empieces a registrar.</div>`;
  const bars = rows.map(r => ({label: `${dateOf(r.mon).getDate()}/${dateOf(r.mon).getMonth() + 1}`, v: r.k, t: r.kt, st: r.n ? status(r.k, r.kt) : 'none', detail: r.n ? `Semana del ${shortDate(r.mon)}: media ${fInt(r.k)} de ${fInt(r.kt)} kcal, ${r.ok} de ${r.n} días en rango` : `Semana del ${shortDate(r.mon)}: sin registros`}));
  return `
    <section class="card">
      <h2 class="section-title">Media semanal de calorías</h2>
      ${barChart(bars, 'hist')}
      <div class="legend"><span><i class="sw" style="background:var(--ok)"></i>En rango</span><span><i class="sw" style="background:var(--warn)"></i>Cerca</span><span><i class="sw" style="background:var(--bad)"></i>Fuera</span><span><i class="ln"></i>Objetivo medio</span></div>
    </section>
    ${wts.length ? `<section class="card"><h2 class="section-title">Peso</h2>${lineChart(wts)}</section>` : ''}
    <section class="card">
      <h2 class="section-title">Semanas anteriores</h2>
      <table class="tbl"><thead><tr><th>Semana</th><th>kcal/día</th><th>Prot./día</th><th>Días en rango</th></tr></thead><tbody>
      ${withData.slice().reverse().map(r => `<tr data-a="goWeek" data-w="${r.mon}" style="cursor:pointer"><td>${dateOf(r.mon).getDate()} ${MESES[dateOf(r.mon).getMonth()]}</td><td>${fInt(r.k)} ${stDot(status(r.k, r.kt))}</td><td>${fG(r.p)} g</td><td>${r.ok}/${r.n}</td></tr>`).join('')}
      </tbody></table>
      <p class="hint">Toca una semana para ver el detalle.</p>
    </section>`;
}
function barChart(items, id) {
  const W = 340, H = 170, pl = 34, pr = 6, pt = 10, pb = 22;
  const max = Math.max(1, ...items.map(i => Math.max(i.v, i.t))) * 1.08;
  const nice = max > 3000 ? 1000 : max > 1200 ? 500 : 250;
  const top = Math.ceil(max / nice) * nice;
  const y = v => pt + (H - pt - pb) * (1 - v / top);
  const bw = (W - pl - pr) / items.length;
  const barW = Math.min(26, bw * .56);
  let g = '';
  for (let v = 0; v <= top; v += nice) g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? NF1.format(v / 1000) + ' k' : v}</text>`;
  items.forEach((it, i) => {
    const cx = pl + bw * i + bw / 2, x = cx - barW / 2;
    if (it.v > 0) {
      const yy = y(it.v), h = Math.max(2, H - pb - yy), rr = Math.min(4, h / 2, barW / 2);
      g += `<path d="M${x} ${H - pb} V${yy + rr} Q${x} ${yy} ${x + rr} ${yy} H${x + barW - rr} Q${x + barW} ${yy} ${x + barW} ${yy + rr} V${H - pb} Z" style="fill:var(--${it.st === 'none' ? 'line' : it.st})" data-bar="${i}"/>`;
    }
    if (it.t > 0) g += `<line class="tgt" x1="${cx - barW / 2 - 4}" x2="${cx + barW / 2 + 4}" y1="${y(it.t)}" y2="${y(it.t)}"/>`;
    if (items.length <= 8 || (items.length - 1 - i) % 2 === 0) g += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${esc(it.label)}</text>`;
    g += `<rect class="hit" x="${pl + bw * i}" y="${pt}" width="${bw}" height="${H - pt}" data-a="chartTap" data-c="${id}" data-i="${i}"><title>${esc(it.detail)}</title></rect>`;
  });
  CHARTS[id] = items;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de barras de calorías">${g}</svg><div class="chart-detail" id="cd-${id}">Toca una barra para ver el detalle.</div>`;
}
const CHARTS = {};
function lineChart(pts) {
  const W = 340, H = 150, pl = 34, pr = 10, pt = 12, pb = 22;
  const ws = pts.map(p => p.w), mn = Math.min(...ws), mx = Math.max(...ws);
  const lo = Math.floor(mn - .5), hi = Math.ceil(mx + .5);
  const t0 = dateOf(pts[0].k).getTime(), t1 = Math.max(t0 + 864e5, dateOf(pts[pts.length - 1].k).getTime());
  const x = k => pl + (W - pl - pr) * (dateOf(k).getTime() - t0) / (t1 - t0);
  const y = w => pt + (H - pt - pb) * (1 - (w - lo) / (hi - lo));
  let g = '';
  const step = (hi - lo) > 6 ? 2 : 1;
  for (let v = lo; v <= hi; v += step) g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  g += `<polyline points="${pts.map(p => `${x(p.k)},${y(p.w)}`).join(' ')}" style="fill:none;stroke:var(--leaf);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>`;
  g += pts.map(p => `<circle cx="${x(p.k)}" cy="${y(p.w)}" r="4" style="fill:var(--leaf);stroke:var(--surface);stroke-width:2"><title>${shortDate(p.k)}: ${NF1.format(p.w)} kg</title></circle>`).join('');
  g += `<text x="${pl}" y="${H - 6}">${shortDate(pts[0].k)}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end">${shortDate(pts[pts.length - 1].k)}</text>`;
  const first = pts[0], last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del peso">${g}</svg><p class="hint">${pts.length > 1 ? `${NF1.format(last.w)} kg el ${shortDate(last.k)}, ${deltaText(last.w - first.w, first.k).replace(/^\+/, '+')}` : `${NF1.format(last.w)} kg el ${shortDate(last.k)}`}</p>`;
}

  }));
}

/* ---------- copias de seguridad ---------- */
async function exportData() {
  const payload = {app: 'hoja', version: 1, exportedAt: new Date().toISOString(), data: S};
  const name = `hoja-copia-${today()}.json`;
  const blob = new Blob([JSON.stringify(payload)], {type: 'application/json'});
  const mark = () => { S.settings.lastBackup = Date.now(); save(); render(); toast('Copia de seguridad guardada'); };
  try {
    const file = new File([blob], name, {type: 'application/json'});
    if (navigator.canShare && navigator.canShare({files: [file]}) && matchMedia('(pointer: coarse)').matches) {
      await navigator.share({files: [file], title: 'Copia de Hoja'});
      mark(); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  mark();
}
function importData() { const f = $('#importFile'); f.value = ''; f.click(); }
$('#importFile').addEventListener('change', async ev => {
  const file = ev.target.files && ev.target.files[0]; if (!file) return;
  try {
    const j = JSON.parse(await file.text());
    const data = j && j.app === 'hoja' ? j.data : j;
    if (!data || typeof data !== 'object' || !data.settings || !data.days) throw new Error('formato');
    const n = Object.keys(data.days).length;
    const when = j.exportedAt ? ` del ${shortDate(keyOf(new Date(j.exportedAt)))}` : '';
    if (!confirm(`Esta copia${when} tiene ${n} días registrados. Recuperarla reemplazará los datos actuales de este dispositivo. ¿Continuar?`)) return;
    S = migrate(data); S.settings.lastBackup = Date.now(); dirtyIndex(); save(); CUR = today(); render();
    toast('Copia recuperada');
  } catch (e) { toast('Ese archivo no es una copia de Hoja válida'); }
});

  editRecipe: a => openRecipeEditor(a.dataset.id),
  macroMode: a => { S.settings.macroMode = a.dataset.m; save(); renderSettings(); },
  mealMove: a => { const i = +a.dataset.i, j = i + +a.dataset.d, m = S.settings.meals; [m[i], m[j]] = [m[j], m[i]]; save(); renderSettings(); },
  mealDel: a => { const m = S.settings.meals[+a.dataset.i]; if (!confirm(`¿Eliminar «${m.name}» de tus comidas? Lo ya registrado se conserva como «Otras».`)) return; S.settings.meals.splice(+a.dataset.i, 1); save(); renderSettings(); },
  mealAdd: () => { S.settings.meals.push({id: uid('m'), name: 'Nueva comida'}); save(); renderSettings(); const ins = $$('[data-meal]'); const last = ins[ins.length - 1]; last.focus(); last.select(); },
  wipe: () => { if (!confirm('Se borrarán todos tus registros, alimentos y comidas de este dispositivo. ¿Seguro?')) return; if (!confirm('Esta acción no se puede deshacer. ¿Borrar todo?')) return; S = defaultState(); dirtyIndex(); save(); CUR = today(); render(); toast('Datos borrados'); },
};
function openCategory(c) {
  openSheet(c, body => {
    const items = BASE.filter(f => f.c === c).map(f => getFood(f.id)).sort((a, b) => a.n.localeCompare(b.n, 'es'));
    body.innerHTML = `<ul class="rlist">${items.map(f => `<li class="ritem"><div class="rmain" data-s="v" data-fid="${f.fid}"><span class="rname">${esc(f.n)}</span><span class="rsub">${per100Text(f)}, P ${fG(f.p)} C ${fG(f.h)} G ${fG(f.g)}</span></div></li>`).join('')}</ul>`;
    body.addEventListener('click', ev => { const a = ev.target.closest('[data-s]'); if (a) openBaseFood(a.dataset.fid); });
  });
}
document.addEventListener('click', ev => {
  const a = ev.target.closest('[data-a]'); if (!a || a.disabled) return;
  const fn = ACT[a.dataset.a]; if (fn) { ev.preventDefault(); fn(a, ev); }
});
document.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[data-a].entry, .rmain[role="button"]')) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && TAB === 'hoy' && !sheets.length) render(); });

/* ---------- inicio ---------- */
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
